function buildPrompt(text){
  var L = aiLen();
  var sys = '你是一部低魔中世纪领地经营小说的旁白。' +
    '玩家是领主' + S.lord.name + '，' + S.lord.age + ' 岁，' +
    ORIGINS[S.lord.origin].name + '出身，性情' + NATURES[S.lord.nature].name + '。' +
    '现在是第 ' + S.day + ' 天，地处' + ENV_NAME[S.env] + '，人口 ' + S.pop +
    '，兵 ' + troopTotal() + '，粮 ' + Math.round(S.res.food) +
    '，水 ' + Math.round(S.res.water) + '，金 ' + Math.round(S.res.gold) +
    '，民心 ' + Math.round(S.morale) + '。' +
    '写作要求：第二人称，语气克制，不写现代词汇，不出现具体年份。' +
    '篇幅控制在 ' + L.min + ' 到 ' + L.max + ' 字之间。' +
    '边界：只回应当前这一句，描写玩家这个举动带来的直接结果和周围人的反应；' +
    '不替玩家做决定，不替玩家说话，不往下推进玩家没有提到的情节，不抢答，不跑题；' +
    '不总结，不评论，不对玩家说教。';
  return [
    { role: 'system', content: sys },
    { role: 'user', content: text }
  ];
}
function doFree(text){
  var key = dsKey();
  if(!key){
    setTimeout(function(){ say('四下无人应声。', 'sys'); }, 500);
    return;
  }
  var L = aiLen();
  say('等着……', 'sys');
  fetch(aiBase(), {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + key
    },
    body: JSON.stringify({
      model: aiModel(),
      messages: buildPrompt(text),
      temperature: 0.9,
      max_tokens: L.tokens
    })
  }).then(function(r){ return r.json(); }).then(function(j){
    var box = $('narrative');
    var last = box.lastElementChild;
    if(last && last.className === 'sys' && last.textContent === '等着……'){
      box.removeChild(last);
    }
    var t = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if(t) say(String(t).trim());
    else say('……没有回应。', 'sys');
  }).catch(function(){
    var box = $('narrative');
    var last = box.lastElementChild;
    if(last && last.className === 'sys' && last.textContent === '等着……'){
      box.removeChild(last);
    }
    say('……信号断了。', 'sys');
  });
}
function freeAction(text){
  say('你：' + text, 'think');
  if(!lenRaw()){
    askLen(function(){ doFree(text); });
  }else{
    doFree(text);
  }
}

/* ================= 事件结算 ================= */
function runEff(list){
  var out = [];
  (list || []).forEach(function(e){
    if(!Array.isArray(e)) return;
    var k = e[0];
    if(k === 'res'){
      var key = e[1], n = e[2];
      if(!RES_NAME[key] || typeof n !== 'number') return;
      if(S.res[key] + n < 0) n = -S.res[key];
      S.res[key] = Math.max(0, S.res[key] + n);
      if(n) out.push(RES_NAME[key] + (n > 0 ? ' +' + n : ' ' + n));
    }else if(k === 'item'){
      var id = e[1], n2 = e[2];
      if(!ITEMS[id] || typeof n2 !== 'number') return;
      if(n2 > 0){
        addItem(id, n2);
        out.push(ITEMS[id].name + ' +' + n2);
      }else{
        if(takeItem(id, -n2)) out.push(ITEMS[id].name + ' ' + n2);
      }
    }else if(k === 'pop'){
      var before = S.pop;
      S.pop = Math.max(1, Math.min(houseCap(), S.pop + e[1]));
      var diff = S.pop - before;
      out.push('人口 ' + (diff >= 0 ? '+' : '') + diff);
    }else if(k === 'morale'){
      S.morale = clamp(S.morale + e[1], 0, 100);
      out.push('民心 ' + (e[1] > 0 ? '+' : '') + e[1]);
    }else if(k === 'energy'){
      S.energy.cur = clamp(S.energy.cur + e[1], 0, S.energy.max);
      out.push('精力 +' + e[1]);
    }else if(k === 'talent'){
      addTalent();
      out.push('有人投奔');
    }else if(k === 'hero'){
      addHero();
      out.push('来了个带兵的');
    }else if(k === 'troop'){
      if(S.unlocked[e[1]]){
        S.troops[e[1]].n = Math.max(0, S.troops[e[1]].n + e[2]);
        out.push(TROOP[e[1]].name + (e[2] > 0 ? ' +' : ' ') + e[2]);
      }
    }else if(k === 'heal'){
      S.heroes.forEach(function(h){ h.injured = 0; });
      out.push('伤员都好了');
    }
  });
  return out;
}
function runOpt(o){
  if(o.fn){
    try{ o.fn(); }catch(e){}
    return [];
  }
  return runEff(o.e || []);
}

/* ================= 事件触发 ================= */
function localEv(){
  var want = 0;
  if(S.morale >= 70 && chance(0.45)) want = 1;
  else if(S.morale < 30 && chance(0.45)) want = -1;
  var pool = [];
  for(var i = 0; i < EVT.length; i++){
    if(want === 0 || (EVT_MOOD[i] || 0) === want) pool.push(i);
  }
  if(!pool.length){
    for(var j = 0; j < EVT.length; j++) pool.push(j);
  }
  return EVT[pick(pool)];
}
function aiEvent(cb){
  var key = dsKey();
  if(!key){ cb(null); return; }
  var sys = '你是一款低魔中世纪领地经营游戏的随机事件生成器。' +
    '只输出一个 JSON 对象，不要解释、不要代码块、不要多余文字。' +
    '格式：{"t":"标题（4到8个字）","d":"事件描述（40到70字，第二人称，语气克制）",' +
    '"o":[{"l":"选项（不超过14字）","e":[["res","gold",50]]}, {}, {}]}。' +
    '三个选项必须有取舍，不能全是好处。' +
    '可用效果：["res","gold"/"wood"/"stone"/"food"/"water",整数]；' +
    '["item","iron"/"coal"/"ore"/"hide"/"gem"/"potion"/"grain"/"scroll"/"tea"/"sword"/"bow"/"armor"/"charm",整数]；' +
    '["pop",整数]；["morale",整数]；["energy",整数]；["talent"]；["hero"]；["heal"]。' +
    '数值范围：资源 -250 到 250，物品 -3 到 3，人口 -4 到 4，民心 -8 到 8。' +
    '不写现代词汇，不出现具体年份。';
  var usr = '当前局势：第 ' + S.day + ' 天，' + ENV_NAME[S.env] + '，人口 ' + S.pop +
    '，兵 ' + troopTotal() + '，金币 ' + Math.round(S.res.gold) +
    '，粮 ' + Math.round(S.res.food) + '，水 ' + Math.round(S.res.water) +
    '，木 ' + Math.round(S.res.wood) + '，石 ' + Math.round(S.res.stone) +
    '，民心 ' + Math.round(S.morale) + '。生成一个贴合这个局势的事件。';
  var ctrl = null;
  try{ ctrl = new AbortController(); }catch(e){ ctrl = null; }
  var t = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 9000);
  var opt = {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
    body: JSON.stringify({
      model: aiModel(),
      messages: [{ role: 'system', content: sys }, { role: 'user', content: usr }],
      temperature: 1,
      max_tokens: 500
    })
  };
  if(ctrl) opt.signal = ctrl.signal;
  fetch(aiBase(), opt)
    .then(function(r){ return r.json(); })
    .then(function(j){
      clearTimeout(t);
      var txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if(!txt){ cb(null); return; }
      var m = txt.match(/\{[\s\S]*\}/);
      if(!m){ cb(null); return; }
      var obj = null;
      try{ obj = JSON.parse(m[0]); }catch(e){ obj = null; }
      if(!obj || !obj.t || !obj.d || !Array.isArray(obj.o) || obj.o.length < 2){ cb(null); return; }
      cb(obj);
    })
    .catch(function(){ clearTimeout(t); cb(null); });
}
function showEv(ev){
  var title = ev.t || ev.title || '出了一件事';
  var desc = ev.d || ev.text || '';
  var opts = ev.o || ev.opts || [];
  var html = '<div class="mtag">第 ' + S.day + ' 天　' + ENV_NAME[S.env] + '</div>' +
    '<div class="mtitle">' + esc(title) + '</div>' +
    '<div class="mdesc">' + esc(desc) + '</div>';
  var btns = opts.map(function(o){
    return {
      t: o.l || o.label || '……',
      fn: function(){
        say('【' + title + '】', 'day');
        say(o.l || o.label || '');
        var res = runOpt(o);
        if(res.length) say(res.join('　'), 'good');
        save();
        renderBar();
      }
    };
  });
  if(!btns.length){
    btns = [{
      t: '知道了',
      fn: function(){ say('没发生什么。', 'sys'); }
    }];
  }
  modal(html, btns, true);
}
function maybeEvent(){
  if(!S || busy) return;
  if($('mask').classList.contains('on')) return;
  var p = 0.35 + (rule().event || 0);
  if(!chance(p)) return;
  if(dsKey()){
    aiEvent(function(ev){
      showEv(ev || localEv());
    });
  }else{
    showEv(localEv());
  }
}

/* ================= 人物创建 ================= */
function showCreate(){
  CR = {
    name: '', gender: '男', age: 24,
    origin: 'noble', nature: 'calm', troop: 'militia',
    colorA: FLAG[0], colorB: FLAG[9]
  };
  renderCreateOpts();
  $('create').classList.add('on');
  $('create').scrollTop = 0;
}
function renderCreateOpts(){
  var o = $('crorigin');
  o.innerHTML = '';
  for(var k in ORIGINS){
    (function(key){
      var b = document.createElement('button');
      b.className = 'opt' + (CR.origin === key ? ' on' : '');
      b.innerHTML = ORIGINS[key].name + '<span class="d">' + ORIGINS[key].bonus + '</span>';
      b.onclick = function(){ CR.origin = key; renderCreateOpts(); };
      o.appendChild(b);
    })(k);
  }
  var n = $('crnature');
  n.innerHTML = '';
  for(var j in NATURES){
    (function(key){
      var b = document.createElement('button');
      b.className = 'opt' + (CR.nature === key ? ' on' : '');
      b.innerHTML = NATURES[key].name + '<span class="d">' + NATURES[key].effect + '</span>';
      b.onclick = function(){ CR.nature = key; renderCreateOpts(); };
      n.appendChild(b);
    })(j);
  }
  var t = $('crtroop');
  t.innerHTML = '';
  for(var tk in TROOP){
    (function(key){
      var b = document.createElement('button');
      b.className = 'opt' + (CR.troop === key ? ' on' : '');
      b.innerHTML = TROOP[key].name + '<span class="d">攻 ' + TROOP[key].atk +
        '　防 ' + TROOP[key].def + '　体 ' + TROOP[key].hp + '</span>';
      b.onclick = function(){ CR.troop = key; renderCreateOpts(); };
      t.appendChild(b);
    })(tk);
  }
  var a = $('crcolorA');
  a.innerHTML = '';
  FLAG.forEach(function(c){
    var el = document.createElement('button');
    el.className = 'col' + (CR.colorA === c ? ' on' : '');
    el.style.background = c;
    el.onclick = function(){ CR.colorA = c; renderCreateOpts(); };
    a.appendChild(el);
  });
  var bb = $('crcolorB');
  bb.innerHTML = '';
  FLAG.forEach(function(c){
    var el = document.createElement('button');
    el.className = 'col' + (CR.colorB === c ? ' on' : '');
    el.style.background = c;
    el.onclick = function(){ CR.colorB = c; renderCreateOpts(); };
    bb.appendChild(el);
  });
  $('crflag').style.background = 'linear-gradient(135deg,' + CR.colorA + ' 0%,' +
    CR.colorA + ' 55%,' + CR.colorB + ' 55%,' + CR.colorB + ' 100%)';
  $('crageshow').textContent = CR.age;
}
function bindCreate(){
  $('crname').value = CR ? CR.name : '';
  $('crage').oninput = function(){
    CR.age = parseInt(this.value, 10) || 24;
    $('crageshow').textContent = CR.age;
  };
  $('crgender').querySelectorAll('.opt').forEach(function(b){
    b.onclick = function(){
      CR.gender = b.dataset.v;
      $('crgender').querySelectorAll('.opt').forEach(function(x){
        x.classList.toggle('on', x === b);
      });
    };
  });
  $('crgo').onclick = finishCreate;
}
function finishCreate(){
  var name = $('crname').value.trim();
  if(!name){ toast('先给自己取个名字'); return; }
  var n = newGame();
  n.lord = {
    name: name.slice(0, 8),
    gender: CR.gender,
    age: CR.age,
    origin: CR.origin,
    nature: CR.nature,
    troop: CR.troop,
    colorA: CR.colorA,
    colorB: CR.colorB
  };
  var tk = CR.troop;
  n.unlocked = { militia: false, spear: false, archer: false, cavalry: false };
  n.unlocked[tk] = true;
  n.troops[tk].n = 5;

  if(CR.origin === 'noble'){ n.res.gold += 300; n.res.wood += 100; }
  if(CR.origin === 'hunter'){ n.res.wood += 200; n.troops[tk].n += 2; }
  if(CR.origin === 'merchant'){ n.res.gold += 250; }
  if(CR.origin === 'officer'){ n.troops[tk].n += 3; n.res.stone += 150; }

  S = n;
  curMapSel = -1;
  pickHero = null;
  ensureMap();
  ensureWorld();
  save();
  $('create').classList.remove('on');
  startGame();
  setTimeout(askKey, 900);
}

/* ================= 行动 ================= */
function renderAct(){
  var html = '';
  html += '<div class="card soft">';
  html += '<h4>出征</h4>';
  html += '<div class="sub">精力 ' + S.energy.cur + ' / ' + S.energy.max +
    '　侦查 ' + S.scout + ' / ' + scoutMax() + '</div>';
  html += '<div class="sub">侦查和出征各吃一格精力' +
    (hasStaff('watch') ? '；塔上有人，侦查不收精力' : '') + '。</div>';
  html += '</div>';

  html += '<div class="map">';
  S.map.forEach(function(m){
    var known = m.scouted;
    var nm = known ? MAPTYPE[m.type].name : '？';
    var tg = known ? MAPTYPE[m.type].tag : '未探明';
    html += '<div class="node' + (known ? '' : ' unknown') +
      (curMapSel === m.i ? ' sel' : '') + '" data-node="' + m.i + '">' +
      '<div class="nm">' + nm + '</div>' +
      '<div class="tag">' + tg + '</div>' +
      '<div class="tag">' + m.left + ' / 3</div></div>';
  });
  html += '</div>';

  var sel = spotOf(curMapSel);
  if(sel){
    var known = sel.scouted;
    var mt = MAPTYPE[sel.type];
    html += '<div class="card">';
    if(!known){
      html += '<h4>看不真切</h4><div class="sub">树影挡着，得先派人去看。</div>';
    }else{
      html += '<h4>' + mt.name + '　<span class="sub">Lv' + sel.lv + '</span></h4>';
      html += line('守备攻击', Math.round(sel.atk * 3.5));
      html += line('守备防御', Math.round(sel.def * 3.5));
      html += line('守备体力', Math.round(sel.hp * 2.8 * (rule().enemyHp || 1)));
      html += line('剩余', sel.left + ' / 3');
      html += line('主产出', itemName(mt.main));
      html += line('副产出', mt.sub.map(itemName).join('、'));
    }
    html += '<div class="btns">';
    if(!known){
      html += '<button class="btn sm" data-scout="' + sel.i + '">侦查　' +
        (hasStaff('watch') ? '不耗精力' : '精力 1') + '</button>';
    }else{
      html += '<button class="btn sm" data-march="' + sel.i + '">出征　精力 1</button>';
    }
    html += '</div></div>';
  }else{
    html += '<div class="card soft"><div class="sub">点一个地方看看。</div></div>';
  }

  var hh = null;
  if(pickHero){
    for(var i = 0; i < S.heroes.length; i++){
      if(S.heroes[i].id === pickHero && !S.heroes[i].injured) hh = S.heroes[i];
    }
    if(!hh) pickHero = null;
  }
  html += '<div class="card"><h4>带队</h4>';
  if(!S.heroes.length){
    html += '<div class="sub">还没有英雄。招兵时撞上一个，就能让他带队。</div>';
  }else{
    var htxt = '无';
    if(hh){
      var hsn = heroStat(hh);
      htxt = esc(hh.name) + '　攻 ' + hsn.atk + '　防 ' + hsn.def;
    }
    html += '<div class="line"><span class="k">带队英雄</span><span class="v">' + htxt + '</span></div>';
    html += '<div class="btns"><button class="btn sm gray" data-heroes="1">换人</button></div>';
  }
  html += '</div>';

  var ap = armyPower();
  html += '<div class="card"><h4>我方</h4>';
  html += line('兵力', troopTotal() + ' 人');
  for(var k in TROOP){
    if(S.unlocked[k] && S.troops[k].n > 0){
      var st = troopStat(k);
      html += line(TROOP[k].name + '（' + LV_NAME[S.troops[k].lv - 1] + '）',
        S.troops[k].n + ' 人　攻 ' + st.atk + ' 防 ' + st.def);
    }
  }
  html += line('总攻', Math.round(ap.atk * moraleAtk()) +
    (moraleAtk() !== 1 ? '（民心修正）' : ''));
  html += line('总防', ap.def);
  html += '</div>';

  html += '<div class="card"><h4>结束今天</h4>' +
    '<div class="sub">精力回满，侦查次数重置。可能会弹出点事。</div>' +
    '<div class="btns"><button class="btn" data-end="1">结束今天</button></div></div>';

  openSheet('行动', html, function(){
    var body = $('sbody');
    body.querySelectorAll('[data-node]').forEach(function(b){
      b.onclick = function(){
        curMapSel = parseInt(b.dataset.node, 10);
        renderAct();
      };
    });
    var sc = body.querySelector('[data-scout]');
    if(sc) sc.onclick = function(){ doScout(parseInt(sc.dataset.scout, 10)); };
    var mc = body.querySelector('[data-march]');
    if(mc) mc.onclick = function(){ doMarch(parseInt(mc.dataset.march, 10)); };
    var hb = body.querySelector('[data-heroes]');
    if(hb) hb.onclick = function(){ pickHeroSheet(); };
    var ed = body.querySelector('[data-end]');
    if(ed) ed.onclick = function(){
      closeSheet();
      doEndDay();
      $('narrative').scrollTop = $('narrative').scrollHeight;
    };
  });
}
function pickHeroSheet(){
  var html = '<div class="line"><span>不带英雄</span>' +
    '<button class="btn sm gray" data-hp="">选</button></div>';
  S.heroes.forEach(function(h){
    var st = heroStat(h);
    html += '<div class="line"><span>' + esc(h.name) +
      (h.injured ? '（有伤）' : '') +
      '<span class="sub" style="display:block">攻 ' + st.atk + '　防 ' + st.def +
      '　体 ' + st.hp + '</span></span>' +
      '<button class="btn sm" data-hp="' + h.id + '">选</button></div>';
  });
  openSheet('带队英雄', html, function(){
    $('sbody').querySelectorAll('[data-hp]').forEach(function(b){
      b.onclick = function(){
        pickHero = b.dataset.hp || null;
        closeSheet();
        renderAct();
      };
    });
  });
}

/* ================= 标签与启动 ================= */
function bindTabs(){
  document.querySelectorAll('#tabbar button').forEach(function(b){
    b.onclick = function(){
      curTab = b.dataset.tab;
      document.querySelectorAll('#tabbar button').forEach(function(x){
        x.classList.toggle('on', x.dataset.tab === curTab);
      });
      openTab(curTab);
    };
    if(b.dataset.tab === curTab) b.classList.add('on');
  });
}
function openTab(t){
  if(t === 'attr') renderAttr();
  else if(t === 'land') renderLand();
  else if(t === 'build') renderBuild();
  else if(t === 'hero') renderHero();
  else if(t === 'store') renderStore();
  else if(t === 'camp') renderCamp();
  else renderAct();
}
function refreshAll(){
  renderBar();
  if($('sheet').classList.contains('on')) openTab(curTab);
}
function bindGlobal(){
  $('scrim').onclick = closeSheet;
  $('sclose').onclick = closeSheet;
  $('mask').onclick = function(e){ if(e.target === $('mask')) closeModal(); };
  $('wclose').onclick = function(){ $('world').classList.remove('on'); };
  $('ioclose').onclick = function(){ $('saveio').classList.remove('on'); };
  $('tagch').onclick = function(){ if(S) openWorld('ch'); };
  $('tagmk').onclick = function(){ if(S) openWorld('mk'); };
  $('bgmbtn').onclick = function(){ AUDIO.toggle(); };
  AUDIO.bind($('bgmbtn'));
  bindTabs();
  bindHelp();
  bindSet();
  bindSaveIO();
  bindCreate();
}
function syncViewport(){
  var setVh = function(){
    var h = window.innerHeight;
    if(window.visualViewport) h = window.visualViewport.height;
    document.documentElement.style.setProperty('--vh', h + 'px');
  };
  setVh();
  window.addEventListener('resize', setVh);
  window.addEventListener('orientationchange', setVh);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', setVh);
}
function startGame(){
  ensureMap();
  ensureWorld();
  ensureActBar();
  renderBar();
  AUDIO.setEnv(S.env);
  curMapSel = -1;
  pickHero = null;
  if(S.scout > scoutMax()) S.scout = scoutMax();
  renderLog();
  var tk = S.lord.troop || 'militia';
  if(!S.troops[tk]) tk = 'militia';
  if(!S.flags.intro){
    S.flags.intro = true;
    sayDay();
    say('你站在' + ENV_NAME[S.env] + '边上，身后是跟过来的 ' + S.pop + ' 口人。');
    say('木料 ' + fmt(S.res.wood) + '，石料 ' + fmt(S.res.stone) +
      '，粮食 ' + fmt(S.res.food) + '，水 ' + fmt(S.res.water) +
      '，金币 ' + fmt(S.res.gold) + '。就这些。');
    say('跟着你来的还有 ' + S.troops[tk].n + ' 个' + TROOP[tk].name +
      '，是他们先站住的脚。', 'sys');
    say('此地' + rule().good + '；' + rule().bad + '。', 'sys');
    say('水缸里还有 ' + fmt(S.res.water) + ' 桶水。一口井都没有，先去打口井，不然撑不了几天。', 'warn');
    save();
  }else{
    NO_LOG = true;
    if(S.log.length) say('— 回到这里 —', 'split');
    sayDay();
    say('你回到帐前。' + ENV_NAME[S.env] + '的风还没停。');
    say('粮 ' + fmt(S.res.food) + '，水 ' + fmt(S.res.water) +
      '，木 ' + fmt(S.res.wood) + '，石 ' + fmt(S.res.stone) +
      '，金 ' + fmt(S.res.gold) + '。', 'sys');
    say('兵 ' + troopTotal() + ' 人，精力 ' + S.energy.cur + ' / ' + S.energy.max +
      '，民心 ' + Math.round(S.morale) + '。', 'sys');
    if(S.res.food < foodNeed() * 2){
      say('仓里的粮撑不了几天了，得赶紧开田或者出门打一趟。', 'warn');
    }
    if(S.res.water < waterNeed() * 2){
      say('水缸快见底了，一口井都没有的话，得先建一口。', 'warn');
    }
    if(S.energy.cur <= 0){
      say('今天已经动不了了，回帐里歇着吧。', 'warn');
    }
    NO_LOG = false;
  }
}
function boot(){
  syncViewport();
  bindGlobal();
  var d = loadSave();
  if(d){
    S = d;
    startGame();
  }else{
    showCreate();
  }
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
