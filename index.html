<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="领主降临" />
<meta name="theme-color" content="#f7f5ef" />
<title>领主降临</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
:root{--bg:#f7f5ef;--card:#fff;--ink:#2b2b2b;--sub:#8a8a86;--line:#e9e4d9;
  --acc:#5aa843;--soft:#dff0d4;--warn:#c4483f;--gold:#c8871c}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;overflow:hidden;
  transition:background .5s ease}
body[data-env="forest"]{--bg:#eef7e8;--acc:#5aa843;--soft:#dff0d4}
body[data-env="plain"]{--bg:#f8f6e7;--acc:#b99526;--soft:#f1ebcd}
body[data-env="desert"]{--bg:#fbf1e2;--acc:#ce8434;--soft:#f6e5cb}
body[data-env="snow"]{--bg:#eef3fa;--acc:#4e86c9;--soft:#dbe7f5}
body[data-env="swamp"]{--bg:#eef4f0;--acc:#4f8f74;--soft:#d9e9df}
body[data-env="grass"]{--bg:#f2f9ea;--acc:#88a828;--soft:#e6f0cf}
body[data-env="hill"]{--bg:#f7f3eb;--acc:#9a7a4e;--soft:#ece2d3}
body[data-env="island"]{--bg:#e9f6f8;--acc:#2f9fb0;--soft:#d3edf1}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(env(safe-area-inset-bottom) + 6px);transition:background .5s ease}
#top{background:var(--card);border-bottom:1px solid var(--line);z-index:5;flex:0 0 auto}
#topbar{position:relative;display:flex;align-items:center;justify-content:space-between;
  height:44px;padding:0 8px}
#topbar .side{display:flex;align-items:center;gap:4px}
#title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:15px;font-weight:700;letter-spacing:2px;color:var(--acc);white-space:nowrap}
.tbtn{font:inherit;font-size:12px;padding:4px 9px;border-radius:9px;
  border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.tbtn.rnd{width:25px;height:25px;padding:0;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:13px;line-height:1}

#bar{display:flex;align-items:center;gap:10px;padding:4px 12px 5px;
  font-size:12.5px;color:var(--sub);white-space:nowrap;overflow-x:auto}
#bar::-webkit-scrollbar{display:none}
#barEnergy{margin-left:auto;font-size:13px;letter-spacing:2px;color:var(--gold)}
#barEnergy i{font-style:normal;opacity:.22}
#barEnergy i.on{opacity:1}

#resbar{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:5px 12px 7px;
  background:var(--card);border-top:1px dashed var(--line);
  font-size:12px;color:var(--sub);overflow-x:auto;white-space:nowrap}
#resbar::-webkit-scrollbar{display:none}
#resbar .rb{display:inline-flex;align-items:baseline;gap:2px}
#resbar .rb b{font-size:13.5px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums}
#resbar .rb i{font-style:normal;font-size:11px;color:var(--sub)}

#narrative{flex:1;min-height:0;height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px 22px}
#narrative p{margin-bottom:9px;font-size:14.5px;word-break:break-word;overflow-wrap:anywhere}
#narrative p.sys{color:var(--sub);font-size:13px;background:var(--card);
  border-left:3px solid var(--line);border-radius:0 10px 10px 0;padding:8px 10px}
#narrative p.warn{color:var(--warn);border-left-color:var(--warn)}
#narrative p.good{color:var(--acc);border-left-color:var(--acc)}
#narrative p.day{color:var(--acc);font-weight:700;letter-spacing:1px;margin-top:16px}
#narrative p.think{color:#6b7a8f;font-size:13.5px}
#narrative p.split{color:var(--sub);font-size:12px;text-align:center;letter-spacing:2px;margin:14px 0 10px}
#narrative strong{color:var(--gold);font-weight:600}

#tabbar{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:8px 10px 4px;
  background:var(--card);border-top:1px solid var(--line);scrollbar-width:none}
#tabbar::-webkit-scrollbar{display:none}
#tabbar button{flex:0 0 auto;font:inherit;font-size:13px;padding:9px 15px;border-radius:12px;
  border:1px solid var(--line);background:var(--soft);color:var(--ink);transition:.15s}
#tabbar button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}

#scrim{position:fixed;inset:0;background:rgba(45,38,25,.3);opacity:0;
  pointer-events:none;transition:opacity .22s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:84vh;background:var(--card);
  border-radius:20px 20px 0 0;transform:translateY(105%);z-index:21;
  transition:transform .26s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.12)}
#sheet.on{transform:translateY(0)}
#shead{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 6px}
#stitle{font-size:16px;font-weight:700}
#sclose{border:0;background:transparent;font-size:17px;color:var(--sub);padding:2px 8px}
#sbody{flex:1;min-height:0;height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:4px 16px 10px}

.page{position:fixed;top:0;left:0;right:0;bottom:0;display:none;z-index:30;
  background:var(--card);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.page.on{display:block}
.phead{position:sticky;top:0;z-index:2;background:var(--card);
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--line)}
.ptitle{font-size:15px;font-weight:700;letter-spacing:1px}
.pbody{padding:14px 14px 30px}
.pclose{border:0;background:transparent;font-size:17px;color:var(--sub);padding:2px 8px}

.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card)}
.card.soft{background:var(--soft);border-color:transparent}
.card h4{font-size:14px;margin-bottom:4px}
.card .sub{color:var(--sub);font-size:12.5px;line-height:1.55}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.line:last-child{border-bottom:0}
.line .k{color:var(--sub);font-size:13px}
.line .v{font-weight:600}
.sub{color:var(--sub);font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-size:13.5px;padding:9px 15px;border-radius:12px;border:1px solid var(--acc);
  background:var(--acc);color:#fff;font-weight:600;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.gray{background:var(--soft);border-color:var(--line);color:var(--ink);font-weight:400}
.btn.sm{font-size:12px;padding:6px 11px;border-radius:9px}

#mask{position:fixed;inset:0;background:rgba(30,26,18,.55);z-index:40;display:none;
  align-items:center;justify-content:center;padding:18px}
#mask.on{display:flex}
#mbox{background:var(--card);border-radius:20px;width:100%;max-width:380px;
  max-height:86vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.26)}
#mtext{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 20px 10px;font-size:14.5px;line-height:1.7;
  word-break:break-word;overflow-wrap:anywhere}
#mbtns{flex:0 0 auto;padding:12px 16px 16px;border-top:1px solid var(--line);
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#mbtns.vert{display:block}
#mbtns.vert .btn{display:block;width:100%;text-align:left;white-space:normal;
  padding:12px 14px;margin-bottom:8px;border-radius:12px;
  font-weight:400;font-size:14px;line-height:1.5;word-break:break-word;
  background:var(--soft);border-color:var(--line);color:var(--ink)}
#mbtns.vert .btn:active{background:var(--line)}
#mbtns.vert .btn:last-child{margin-bottom:0}
.mtitle{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--ink);
  letter-spacing:1px;line-height:1.4}
.mtag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;
  background:var(--soft);color:var(--acc);margin-bottom:8px;letter-spacing:1px}
.mdesc{font-size:13.5px;color:#4a4a46;line-height:1.75}

.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.node{border:1px solid var(--line);border-radius:12px;padding:9px 5px;text-align:center;
  background:var(--soft);transition:.15s}
.node .nm{font-size:12.5px;font-weight:600;line-height:1.3}
.node .tag{font-size:11px;color:var(--sub);margin-top:2px}
.node.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--soft);background:var(--card)}
.node.unknown{color:var(--sub)}

.slots{display:flex;gap:8px;margin:8px 0}
.slot{flex:1;border:1px dashed var(--line);border-radius:12px;min-height:66px;padding:8px 4px;
  font-size:12px;text-align:center;background:var(--soft);color:var(--sub);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.35}
.slot.has{border-style:solid;border-color:var(--acc);color:var(--ink);background:var(--card)}
.slot b{font-size:12.5px;display:block}

.bar{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}

.chatmsg{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px;
  word-break:break-word;overflow-wrap:anywhere}
.chatmsg .who{color:var(--acc);font-weight:600}
.chatmsg .me .who{color:var(--gold)}
#chatin{display:flex;gap:8px;margin-top:12px}
#chatin input{flex:1;min-width:0;font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--soft);color:var(--ink)}
#chatin button{font:inherit;font-size:13.5px;padding:0 16px;border-radius:12px;border:0;
  background:var(--acc);color:#fff;font-weight:600}

#helppage .pbody h3,#setpage .pbody h3{font-size:14.5px;margin:16px 0 6px;color:var(--acc)}
#helppage .pbody p,#setpage .pbody p{font-size:13.5px;color:#4a4a46;margin-bottom:8px}
#saveio .pbody textarea{width:100%;height:190px;font-size:12px;padding:10px;border-radius:12px;
  border:1px solid var(--line);background:var(--soft);color:var(--ink);resize:none}

#create{background:var(--bg)}
.cwrap{padding:8px 20px 40px}
.cfield{margin-bottom:15px}
.cfield label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;letter-spacing:1px}
.cfield input[type=text]{width:100%;font:inherit;font-size:15px;padding:11px 13px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--ink)}
.cfield input[type=range]{width:100%;accent-color:var(--acc)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-size:13px;padding:9px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);text-align:left}
.opt.on{border-color:var(--acc);background:var(--soft);font-weight:600}
.opt .d{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:2px}
.cols{display:flex;gap:6px;flex-wrap:wrap}
.col{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.col.on{border-color:var(--ink)}
#crgo{width:100%;margin-top:24px;padding:14px;font-size:15px}
.flag{width:74px;height:46px;border-radius:8px;margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}

#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,14px);z-index:50;
  background:rgba(44,40,32,.9);color:#fff;font-size:13.5px;padding:9px 16px;border-radius:20px;
  opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:88vw;overflow:hidden}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<body data-env="forest">

<div id="app">
  <header id="top">
    <div id="topbar">
      <div class="side"><button id="tagch" class="tbtn">频道</button></div>
      <div id="title">领主降临</div>
      <div class="side">
        <button id="tagmk" class="tbtn">交易</button>
        <button id="bgmbtn" class="tbtn rnd">♪</button>
        <button id="helpbtn" class="tbtn rnd">?</button>
        <button id="setbtn" class="tbtn rnd">⚙</button>
      </div>
    </div>
    <div id="bar">
      <span id="barDay">第 1 天</span>
      <span id="barEnv">森林</span>
      <span id="barPop">50 人</span>
      <span id="barEnergy">⚡⚡⚡</span>
    </div>
    <div id="resbar">
      <span class="rb"><i>粮</i><b id="rbFood">400</b></span>
      <span class="rb"><i>水</i><b id="rbWater">300</b></span>
      <span class="rb"><i>木</i><b id="rbWood">300</b></span>
      <span class="rb"><i>石</i><b id="rbStone">200</b></span>
      <span class="rb"><i>金</i><b id="rbGold">500</b></span>
    </div>
  </header>
  <main id="narrative"></main>
  <nav id="tabbar">
    <button data-tab="attr">属性</button>
    <button data-tab="land">领地</button>
    <button data-tab="build">建造</button>
    <button data-tab="hero">英雄</button>
    <button data-tab="store">仓库</button>
    <button data-tab="camp">兵营</button>
    <button data-tab="act">行动</button>
  </nav>
</div>

<div id="scrim"></div>
<section id="sheet">
  <div id="shead"><b id="stitle">标题</b><button id="sclose">✕</button></div>
  <div id="sbody"></div>
</section>

<section id="world" class="page">
  <div class="phead">
    <b id="wtitle" class="ptitle">世界频道</b>
    <button id="wclose" class="pclose">✕</button>
  </div>
  <div class="pbody">
    <div id="wch"></div>
    <div id="wmk"></div>
  </div>
</section>

<section id="helppage" class="page">
  <div class="phead"><b class="ptitle">游戏攻略</b><button id="hclose" class="pclose">✕</button></div>
  <div class="pbody" id="helpbody"></div>
</section>

<section id="setpage" class="page">
  <div class="phead"><b class="ptitle">设置</b><button id="setclose" class="pclose">✕</button></div>
  <div class="pbody" id="setbody"></div>
</section>

<section id="saveio" class="page">
  <div class="phead"><b class="ptitle">存档码</b><button id="ioclose" class="pclose">✕</button></div>
  <div class="pbody">
    <p class="sub" style="margin-bottom:10px">换设备前复制走，粘回来就能接上。</p>
    <textarea id="iotext" spellcheck="false"></textarea>
    <div class="btns">
      <button id="iocopy" class="btn">复制</button>
      <button id="ioload" class="btn ghost">导入并刷新</button>
    </div>
  </div>
</section>

<section id="create" class="page">
  <div class="phead"><b class="ptitle">领主降临</b></div>
  <div class="pbody">
    <div class="cwrap">
      <div class="cfield">
        <label>姓名</label>
        <input id="crname" type="text" maxlength="8" placeholder="给自己取个名字" />
      </div>
      <div class="cfield">
        <label>性别</label>
        <div class="opts" id="crgender">
          <button class="opt on" data-v="男">男</button>
          <button class="opt" data-v="女">女</button>
        </div>
      </div>
      <div class="cfield">
        <label>年龄　<span id="crageshow">24</span> 岁</label>
        <input id="crage" type="range" min="18" max="55" value="24" />
      </div>
      <div class="cfield">
        <label>出身</label>
        <div class="opts" id="crorigin"></div>
      </div>
      <div class="cfield">
        <label>性情</label>
        <div class="opts" id="crnature"></div>
      </div>
      <div class="cfield">
        <label>起家的兵</label>
        <div class="opts" id="crtroop"></div>
      </div>
      <div class="cfield">
        <label>旗帜主色</label>
        <div class="cols" id="crcolorA"></div>
      </div>
      <div class="cfield">
        <label>旗帜副色</label>
        <div class="cols" id="crcolorB"></div>
      </div>
      <div class="flag" id="crflag"></div>
      <button id="crgo" class="btn">就 此 落 幕</button>
    </div>
  </div>
</section>

<div id="mask"><div id="mbox"><div id="mtext"></div><div id="mbtns"></div></div></div>
<div id="toast"></div>

  wall:{name:'城墙',wood:200,stone:200,desc:'挡住夜里摸过来的人'}

/* ================= 工具 ================= */
function ri(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function rf(a, b){ return a + Math.random() * (b - a); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function chance(p){ return Math.random() < p; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function fmt(n){
  n = Math.round(n);
  if(n >= 100000) return (n / 10000).toFixed(1) + '万';
  return String(n);
}
function safe(fn){
  try{ fn(); }catch(e){}
}
function rule(){
  if(!S) return ENV_RULE.forest;
  return ENV_RULE[S.env] || ENV_RULE.forest;
}
function say(text, cls){
  var box = $('narrative');
  if(!box) return;
  var p = document.createElement('p');
  if(cls) p.className = cls;
  p.innerHTML = esc(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  box.appendChild(p);
  box.scrollTop = box.scrollHeight;
  if(S && Array.isArray(S.log) && !NO_LOG){
    S.log.push({ t: String(text), c: cls || '' });
    if(S.log.length > 160) S.log = S.log.slice(-160);
  }
}
function sayDay(){
  say('第 ' + S.day + ' 天　' + ENV_NAME[S.env], 'day');
}
function saySys(text){ say(text, 'sys'); }
function renderLog(){
  var box = $('narrative');
  box.innerHTML = '';
  if(!S || !Array.isArray(S.log)) return;
  var frag = document.createDocumentFragment();
  S.log.forEach(function(x){
    if(!x || typeof x.t !== 'string') return;
    var p = document.createElement('p');
    if(x.c) p.className = x.c;
    p.innerHTML = esc(x.t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    frag.appendChild(p);
  });
  box.appendChild(frag);
  box.scrollTop = box.scrollHeight;
}
function line(k, v){
  return '<div class="line"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span></div>';
}
function bar(pct, color){
  pct = clamp(pct, 0, 100);
  return '<div class="bar"><i style="width:' + pct + '%;' +
    (color ? 'background:' + color : '') + '"></i></div>';
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('on'); }, 1600);
}

function modal(html, btns, vertical){
  $('mtext').innerHTML = html;
  $('mtext').scrollTop = 0;
  var box = $('mbtns');
  box.innerHTML = '';
  box.className = vertical ? 'vert' : '';
  var list = btns || [{ t: '知道了' }];
  if(!list.length) list = [{ t: '知道了' }];
  for(var i = 0; i < list.length; i++){
    (function(b){
      var el = document.createElement('button');
      el.className = 'btn' + (b.gray ? ' gray' : '') + (b.sm ? ' sm' : '');
      el.textContent = b.t;
      el.onclick = function(){
        var keep = false;
        if(b.fn){
          try{
            if(b.fn() === false) keep = true;
          }catch(e){}
        }
        if(!keep) closeModal();
      };
      box.appendChild(el);
    })(list[i]);
  }
  $('mask').classList.add('on');
}
function closeModal(){
  $('mask').classList.remove('on');
  $('mbtns').className = '';
}

/* ================= 存档 ================= */
function save(){
  if(!S) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function loadSave(){
  var raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw) return null;
  var d = null;
  try{ d = JSON.parse(raw); }catch(e){ return null; }
  if(!d || d.schema !== SCHEMA) return null;
  return repair(d);
}
function normHero(h, i){
  if(!h || typeof h !== 'object') return null;
  var base = h.base && typeof h.base === 'object' ? h.base : null;
  if(!base) base = { atk: 6, def: 5, hp: 32 };
  base.atk = base.atk || 6;
  base.def = base.def || 5;
  base.hp = base.hp || 32;
  return {
    id: h.id || ('h' + i + '_' + Date.now()),
    name: h.name || pick(NAME_POOL),
    gender: h.gender || (chance(0.5) ? '男' : '女'),
    age: typeof h.age === 'number' ? h.age : ri(19, 40),
    rarity: h.rarity || 'N',
    lv: Math.max(1, h.lv || 1),
    exp: h.exp || 0,
    base: base,
    equip: (h.equip && typeof h.equip === 'object')
      ? { weapon: h.equip.weapon || null, armor: h.equip.armor || null, charm: h.equip.charm || null }
      : { weapon: null, armor: null, charm: null },
    injured: h.injured || 0
  };
}
function repair(d){
  var n = newGame();
  if(!d.lord || typeof d.lord !== 'object') d.lord = n.lord;
  if(typeof d.day !== 'number') d.day = 1;
  if(!ENV_NAME[d.env]) d.env = 'forest';
  if(!d.res || typeof d.res !== 'object') d.res = n.res;
  for(var r in n.res){ if(typeof d.res[r] !== 'number') d.res[r] = n.res[r]; }
  if(typeof d.pop !== 'number') d.pop = n.pop;
  if(typeof d.morale !== 'number') d.morale = 50;

  if(!d.builds || typeof d.builds !== 'object') d.builds = n.builds;
  for(var b in n.builds){
    if(!Array.isArray(d.builds[b])) d.builds[b] = n.builds[b].slice();
    d.builds[b] = d.builds[b].map(function(v){
      return clamp(parseInt(v, 10) || 1, 1, 5);
    });
  }
  for(var dead in d.builds){
    if(!BUILD[dead]) delete d.builds[dead];
  }

  if(!d.troops || typeof d.troops !== 'object') d.troops = n.troops;
  for(var t in n.troops){
    var v = d.troops[t];
    if(!v || typeof v !== 'object'){
      d.troops[t] = { n: 0, lv: 1, exp: 0 };
    }else{
      d.troops[t].n = Math.max(0, parseInt(v.n, 10) || 0);
      d.troops[t].lv = clamp(parseInt(v.lv, 10) || 1, 1, 3);
      d.troops[t].exp = Math.max(0, parseInt(v.exp, 10) || 0);
    }
  }
  if(!d.unlocked || typeof d.unlocked !== 'object') d.unlocked = n.unlocked;
  for(var u in n.unlocked){
    if(d.unlocked[u] !== true) d.unlocked[u] = n.unlocked[u];
  }

  if(!d.energy || typeof d.energy !== 'object') d.energy = n.energy;
  d.energy.max = d.energy.max || 3;
  d.energy.cur = clamp(d.energy.cur | 0, 0, d.energy.max);

  if(!d.special || typeof d.special !== 'object') d.special = {};
  for(var sp in SPECIAL){
    if(typeof d.special[sp] !== 'number') d.special[sp] = 0;
  }
  if(!d.staff || typeof d.staff !== 'object') d.staff = {};
  for(var st in SPECIAL){
    if(!(st in d.staff)) d.staff[st] = null;
  }
  if(!d.items || typeof d.items !== 'object') d.items = {};
  if(!d.equip || typeof d.equip !== 'object') d.equip = n.equip;
  if(!d.flags || typeof d.flags !== 'object') d.flags = {};
  if(!Array.isArray(d.heroes)) d.heroes = [];
  d.heroes = d.heroes.map(normHero).filter(function(x){ return !!x; });
  if(!Array.isArray(d.talents)) d.talents = [];
  if(!Array.isArray(d.map)) d.map = [];
  if(!Array.isArray(d.channel)) d.channel = [];
  if(!Array.isArray(d.market)) d.market = [];
  if(!Array.isArray(d.log)) d.log = [];
  d.log = d.log.filter(function(x){
    return x && typeof x.t === 'string';
  }).slice(-160);
  if(typeof d.scout !== 'number') d.scout = 3;
  return d;
}

  };

  function ensure(){
    if(ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.55;
    bgBus  = ctx.createGain(); bgBus.gain.value  = 0.32;
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.65;
    ambBus = ctx.createGain(); ambBus.gain.value = 0.3;
    bgBus.connect(master);
    sfxBus.connect(master);
    ambBus.connect(master);
    master.connect(ctx.destination);
  }
  function midi(n){ return 440 * Math.pow(2, (n - 69) / 12); }
  function blip(f, dur, type, vol, bus){
    if(!ctx || !on) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, ctx.currentTime);
    g.gain.setValueAtTime(vol || 0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g);
    g.connect(bus || sfxBus);
    o.start();
    o.stop(ctx.currentTime + dur + 0.02);
  }
  function noise(dur, vol, freq){
    if(!ctx || !on) return;
    var len = Math.floor(ctx.sampleRate * dur);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq || 800;
    f.Q.value = 0.8;
    var g = ctx.createGain();
    g.gain.value = vol || 0.2;
    src.connect(f);
    f.connect(g);
    g.connect(sfxBus);
    src.start();
  }
  function ambHit(){
    var a = AMB[key];
    if(!a) return;
    if(a[0] === 'bird'){
      var f = 1700 + Math.random() * 1500;
      blip(f, 0.11, 'sine', 0.05, ambBus);
      setTimeout(function(){ blip(f * 1.14, 0.09, 'sine', 0.04, ambBus); }, 140);
    }else if(a[0] === 'frog'){
      blip(190 + Math.random() * 60, 0.16, 'sine', 0.05, ambBus);

    }

  function loop(){
    if(!on || !ctx) return;
    var c = SONGS[key] ? SONGS[key][song] : SONGS.forest[0];
    var stepLen = 60 / c.b / 2;
    var chord = c.p[Math.floor(step / 8) % c.p.length];
    var note = c.r + chord + c.d[c.t[step % c.t.length]];
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = c.w;
    osc.frequency.setValueAtTime(midi(note), t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.17, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + stepLen * 1.35);
    osc.connect(g);
    g.connect(bgBus);
    osc.start(t0);
    osc.stop(t0 + stepLen * 1.5);
    if(step % 6 === 0 && chance(0.3)) ambHit();
    step++;
    if(Date.now() - bornAt > 42000){
      bornAt = Date.now();
      song = (song + 1) % 3;
      step = 0;
    }
    timer = setTimeout(loop, stepLen * 1000);
  }
  function stopTimer(){
    if(timer){ clearTimeout(timer); timer = null; }
  }
  function startLoop(){
    stopTimer();
    step = 0;
    bornAt = Date.now();
    loop();
  }
  function toggle(){
    ensure();
    if(!ctx) return false;
    if(ctx.state === 'suspended') ctx.resume();
    on = !on;
    if(on) startLoop();
    else stopTimer();
    if(bgmBtn){
      bgmBtn.textContent = on ? '♪' : '♪̸';
      bgmBtn.style.opacity = on ? '1' : '.45';
    }
    return on;
  }
  function setEnv(e){
    if(!e || key === e) return;

  function play(name){

    }else if(name === 'crowd'){

    }else if(name === 'fail'){
      blip(300, 0.16, 'sawtooth', 0.1);
      setTimeout(function(){ blip(198, 0.24, 'sawtooth', 0.1); }, 120);
    }else if(name === 'level'){
      [523, 659, 784, 1046].forEach(function(f, i){
        setTimeout(function(){ blip(f, 0.15, 'triangle', 0.15); }, i * 85);
      });

/* ================= 计算 ================= */
var SLOT_NAME = { weapon: '武器', armor: '护甲', charm: '饰品' };

function bCount(k){ return S.builds[k] ? S.builds[k].length : 0; }
function bSum(k){
  var a = S.builds[k];
  if(!a) return 0;
  var s = 0;
  for(var i = 0; i < a.length; i++) s += a[i];
  return s;
}
function bAvg(k){
  var a = S.builds[k];
  if(!a || !a.length) return 0;
  return bSum(k) / a.length;
}
function bLowest(k){
  var a = S.builds[k];
  if(!a || !a.length) return 0;
  var m = 5;
  for(var i = 0; i < a.length; i++) if(a[i] < m) m = a[i];
  return m;
}
function bLowIndex(k){
  var a = S.builds[k];
  var idx = -1, m = 9;
  for(var i = 0; i < a.length; i++){
    if(a[i] < m){ m = a[i]; idx = i; }
  }
  return idx;
}
function bAllMax(k){
  var a = S.builds[k];
  if(!a || !a.length) return false;
  for(var i = 0; i < a.length; i++) if(a[i] < 5) return false;
  return true;
}
function bSummary(k){
  var a = S.builds[k];
  if(!a || !a.length) return 'Lv1';
  var cnt = {};
  a.forEach(function(v){ cnt[v] = (cnt[v] || 0) + 1; });
  var parts = [];
  for(var i = 1; i <= 5; i++){
    if(cnt[i]) parts.push('Lv' + i + '×' + cnt[i]);
  }
  return parts.join('　');
}
function houseCap(){
  var cap = 0;
  S.builds.house.forEach(function(lv){ cap += 10 + (lv - 1) * 4; });
  return cap;
}
function farmCap(){
  return Math.floor(houseCap() / 5);
}
function troopTotal(){
  var n = 0;
  for(var k in S.troops) n += S.troops[k].n || 0;
  return n;
}
function troopStat(k){
  var t = TROOP[k];
  var u = S.troops[k];
  var m = LV_MUL[clamp(u.lv, 1, 3) - 1];
  return {
    atk: Math.round(t.atk * m),
    def: Math.round(t.def * m),
    hp: Math.round(t.hp * m)
  };
}
function armyPower(){
  var a = 0, d = 0, h = 0;
  for(var k in S.troops){
    var n = S.troops[k].n || 0;
    if(!n) continue;
    var st = troopStat(k);
    a += st.atk * n;
    d += st.def * n;
    h += st.hp * n;
  }
  return { atk: a, def: d, hp: h };
}
function heroStat(h){
  var a = h.base.atk, d = h.base.def, hp = h.base.hp;
  ['weapon', 'armor', 'charm'].forEach(function(s){
    var e = h.equip ? h.equip[s] : null;
    if(!e) return;
    var it = ITEMS[e.id];
    if(!it) return;
    var m = 1 + (e.plus || 0) * 0.5;
    if(it.atk) a += Math.round(it.atk * m);
    if(it.def) d += Math.round(it.def * m);
    if(it.luck) a += (e.plus || 0);
  });
  return {
    atk: a + (h.lv - 1) * 2,
    def: d + (h.lv - 1),
    hp: hp + (h.lv - 1) * 6
  };
}
function lordEq(){
  var a = 0, d = 0, luck = 0;
  ['weapon', 'armor', 'charm'].forEach(function(s){
    var e = S.equip[s];
    if(!e) return;
    var it = ITEMS[e.id];
    if(!it) return;
    var m = 1 + (e.plus || 0) * 0.5;
    if(it.atk) a += Math.round(it.atk * m);
    if(it.def) d += Math.round(it.def * m);
    if(it.luck) luck += it.luck + (e.plus || 0);
  });
  return { atk: a, def: d, luck: luck };
}

/* 特殊建筑：没人主持 = 完全停摆 */
function specialRate(key){
  if(!S.special[key]) return 0;
  if(!S.staff[key]) return 0;
  return 1 + (S.special[key] - 1) * 0.35;
}
function hasStaff(key){
  return !!(S.special[key] && S.staff[key]);
}

function wallDef(){
  var d = 0;
  S.builds.wall.forEach(function(lv){ d += lv * 6; });
  if(!d) return 0;
  return Math.round(d * (rule().wall || 1));
}
function costMod(){ return rule().buildCost || 1; }

function waterProd(){
  var w = 0;
  S.builds.well.forEach(function(lv){
    w += 50 * (1 + (lv - 1) * 0.35);
  });
  return Math.round(w);
}
function waterNeed(){
  var n = S.pop * 0.5 + troopTotal() * 0.5 + S.heroes.length * 1;
  n *= (rule().waterNeed || 1);
  if(hasStaff('shrine')) n *= 0.85;
  return Math.round(n);
}

function prod(){
  var f = ENV_FACTOR[S.env];
  var r = rule();
  var cap = farmCap();
  var used = 0;
  var food = 0;
  S.builds.farm.forEach(function(lv){
    if(used >= cap) return;
    food += 12 * f.food * (r.farm || 1) * (1 + (lv - 1) * 0.3);
    used++;
  });
  food *= (r.food || 1);

  var wood = 0, stone = 0;
  S.builds.lumber.forEach(function(lv){
    wood += 20 * f.wood * (r.lumber || 1) * (1 + (lv - 1) * 0.35);
  });
  S.builds.quarry.forEach(function(lv){
    stone += 15 * f.stone * (r.stone || 1) * (1 + (lv - 1) * 0.35);
  });

  var ore = hasStaff('mine') ? Math.round(4 * specialRate('mine') * (r.ore || 1)) : 0;
  var coal = hasStaff('colliery') ? Math.round(3 * specialRate('colliery')) : 0;
  var iron = hasStaff('forge') ? Math.round(2 * specialRate('forge')) : 0;
  var gold = hasStaff('market') ? Math.round(30 * specialRate('market')) : 0;
  var horse = hasStaff('stable') ? Math.round(1 * specialRate('stable') * (r.horse || 1)) : 0;

  var smelt = 0;
  if(hasStaff('smelter')){
    var capSmelt = Math.round(2 * specialRate('smelter'));
    smelt = Math.min(capSmelt, Math.floor(countItem('ore') / 3));
  }

  return {
    food: Math.round(food),
    water: waterProd(),
    wood: Math.round(wood),
    stone: Math.round(stone),
    gold: gold,
    iron: iron,
    coal: coal,
    ore: ore,
    hide: 0,
    horse: horse,
    smelt: smelt
  };
}
function foodNeed(){
  var n = S.pop + troopTotal() * 2 + S.heroes.length * 5;
  if(S.lord.nature === 'calm') n *= 0.95;
  n *= (rule().foodNeed || 1);
  return Math.round(n);
}
function scoutMax(){
  return Math.max(1, 3 + (rule().scout || 0));
}
function recruitCost(k){
  var base = TROOP[k].cost;
  var off = Math.min(0.25, bAvg('barracks') * 0.05);
  if(S.flags.recruitCut) off += 0.3;
  return Math.max(10, Math.round(base * (1 - off)));
}
function oneUpCost(k, lv){
  var b = BUILD[k];
  var m = costMod();
  return {
    wood: Math.round(b.wood * 0.6 * lv * m),
    stone: Math.round(b.stone * 0.6 * lv * m)
  };
}
function allUpCost(k){
  var w = 0, s = 0;
  S.builds[k].forEach(function(lv){
    var c = oneUpCost(k, lv);
    w += c.wood;
    s += c.stone;
  });
  return { wood: w, stone: s };
}
function buildCost(k){
  var b = BUILD[k];
  var m = costMod();
  return { wood: Math.round(b.wood * m), stone: Math.round(b.stone * m) };
}
function moraleAtk(){
  if(S.morale >= 70) return 1.1;
  if(S.morale < 30) return 0.9;
  return 1;
}

/* ================= 物品 ================= */
function addItem(id, n){
  if(!ITEMS[id]) return;
  S.items[id] = (S.items[id] || 0) + (n || 1);
}
function countItem(id){ return S.items[id] || 0; }
function takeItem(id, n){
  n = n || 1;
  if(countItem(id) < n) return false;
  S.items[id] -= n;
  if(S.items[id] <= 0) delete S.items[id];
  return true;
}
function useItem(id){
  var it = ITEMS[id];
  if(!it || countItem(id) <= 0) return;
  if(it.cat === '装备'){ toast('装备要到人物面板装'); return; }
  if(it.cat === '图纸' || it.cat === '兵营'){ toast('这东西要到对应页面用'); return; }
  if(!it.use){ toast('这东西留着有用'); return; }
  if(it.use === 'heal'){
    var hurt = S.heroes.filter(function(h){ return h.injured > 0; });
    if(!hurt.length){ toast('眼下没人需要包扎'); return; }
    hurt[0].injured = 0;
    saySys('你替' + hurt[0].name + '换了药，伤口收住了。');
  }else if(it.use === 'food'){
    S.res.food += 80;
    saySys('干粮包倒进仓里，多出 80 份粮。');
  }else if(it.use === 'recruit'){
    S.flags.recruitCut = true;
    saySys('征募文书盖了印，下次招兵能省一笔。');
  }else if(it.use === 'energy'){
    if(S.energy.cur >= S.energy.max){ toast('精神好得很，用不上'); return; }
    S.energy.cur += 1;
    saySys('茶汤下肚，人清醒了些。');
  }
  takeItem(id, 1);
  AUDIO.play('coin');
  save();
  renderStore();
  renderBar();
}

/* ================= 装备 ================= */
function equipItem(id, who){
  var it = ITEMS[id];
  if(!it || !it.slot) return;
  if(countItem(id) <= 0) return;
  var tgt = null;
  if(who === 'lord') tgt = S.equip;
  else{
    for(var i = 0; i < S.heroes.length; i++){
      if(S.heroes[i].id === who) tgt = S.heroes[i].equip;
    }
  }
  if(!tgt) return;
  var old = tgt[it.slot];
  takeItem(id, 1);
  if(old) addItem(old.id, 1);
  tgt[it.slot] = { id: id, plus: 0 };
  AUDIO.play('build');
  save();
  refreshAll();
}
function unequip(who, slot){
  var tgt = null;
  if(who === 'lord') tgt = S.equip;
  else{
    for(var i = 0; i < S.heroes.length; i++){
      if(S.heroes[i].id === who) tgt = S.heroes[i].equip;
    }
  }
  if(!tgt || !tgt[slot]) return;
  var e = tgt[slot];
  addItem(e.id, 1);
  tgt[slot] = null;
  save();
  refreshAll();
}
function slotBox(slot, e, who){
  var it = e ? ITEMS[e.id] : null;
  var txt = it ? esc(it.name) + (e.plus ? ' +' + e.plus : '') : '空';
  return '<div class="slot ' + (it ? 'has' : '') + '" data-slot="' + slot +
    '" data-who="' + who + '"><b>' + txt + '</b><span>' + SLOT_NAME[slot] + '</span></div>';
}
function bindSlots(scope){
  scope.querySelectorAll('.slot').forEach(function(el){
    el.onclick = function(){
      var slot = el.dataset.slot, who = el.dataset.who;
      var cur = null;
      if(who === 'lord') cur = S.equip[slot];
      else{
        for(var i = 0; i < S.heroes.length; i++){
          if(S.heroes[i].id === who) cur = S.heroes[i].equip[slot];
        }
      }
      var list = [];
      for(var id in S.items){
        if(ITEMS[id].slot === slot && S.items[id] > 0) list.push(id);
      }
      if(!list.length && !cur){ toast('仓库里没有可换的' + SLOT_NAME[slot]); return; }
      var html = '';
      list.forEach(function(id){
        var it = ITEMS[id];
        html += '<div class="line"><span>' + esc(it.name) + ' ×' + S.items[id] +
          '<span class="sub" style="display:block">' + esc(it.desc) + '</span></span>' +
          '<button class="btn sm" data-eq="' + id + '">装上</button></div>';
      });
      if(cur){
        html += '<div class="btns"><button class="btn gray" data-off="1">卸下当前</button></div>';
      }
      openSheet(SLOT_NAME[slot], html, function(){
        $('sbody').querySelectorAll('[data-eq]').forEach(function(b){
          b.onclick = function(){
            equipItem(b.dataset.eq, who);
            closeSheet();
          };
        });
        var off = $('sbody').querySelector('[data-off]');
        if(off) off.onclick = function(){ unequip(who, slot); closeSheet(); };
      });
    };
  });
}

/* ================= 属性 ================= */
function renderAttr(){
  var eq = lordEq();
  var p = prod();
  var need = foodNeed();
  var wNeed = waterNeed();
  var net = p.food - need;
  var wNet = p.water - wNeed;
  var r = rule();
  var html = '';

  html += '<div class="card soft">';
  html += '<h4>' + esc(S.lord.name) + '</h4>';
  html += '<div class="sub">' + S.lord.gender + '　' + S.lord.age + ' 岁　' +
    ORIGINS[S.lord.origin].name + '　' + NATURES[S.lord.nature].name + '</div>';
  html += '<div class="sub" style="margin-top:6px">' + NATURES[S.lord.nature].effect + '</div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<h4>此地　' + ENV_NAME[S.env] + '</h4>';
  html += '<div class="sub" style="color:#3f8f4a">' + r.good + '</div>';
  html += '<div class="sub" style="color:#c4483f;margin-top:4px">' + r.bad + '</div>';
  html += '<div class="sub" style="margin-top:6px">粮 ×' + ENV_FACTOR[S.env].food +
    '　木 ×' + ENV_FACTOR[S.env].wood + '　石 ×' + ENV_FACTOR[S.env].stone +
    '　耗水 ×' + (r.waterNeed || 1) + '</div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<h4>装备</h4>';
  html += '<div class="slots">' +
    slotBox('weapon', S.equip.weapon, 'lord') +
    slotBox('armor', S.equip.armor, 'lord') +
    slotBox('charm', S.equip.charm, 'lord') + '</div>';
  html += '<div class="sub">攻击 +' + eq.atk + '　防御 +' + eq.def + '　幸运 +' + eq.luck + '</div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<h4>家底</h4>';
  html += line('人口', S.pop + ' / ' + houseCap());
  html += line('兵力', troopTotal() + ' 人');
  html += line('英雄', S.heroes.length + ' 位');
  html += line('人才', S.talents.length + ' 人');
  html += line('民心', Math.round(S.morale) + ' / 100　' +
    (moraleAtk() > 1 ? '士气高' : (moraleAtk() < 1 ? '士气低' : '平常')));
  html += line('城墙防御', wallDef() || '无');
  html += '</div>';

  html += '<div class="card">';
  html += '<h4>每日收支</h4>';
  html += line('粮产 / 口粮', '+' + p.food + ' / -' + need +
    '　<span class="sub">净 ' + (net >= 0 ? '+' : '') + net + '</span>');
  html += line('水井 / 耗水', '+' + p.water + ' / -' + wNeed +
    '　<span class="sub">净 ' + (wNet >= 0 ? '+' : '') + wNet + '</span>' +
    (wNeed > p.water ? '　缺水' : ''));
  html += line('木材', '+' + p.wood);
  html += line('石料', '+' + p.stone);
  if(p.gold) html += line('金币', '+' + p.gold);
  if(p.iron) html += line('精铁', '+' + p.iron);
  if(p.coal) html += line('煤炭', '+' + p.coal);
  if(p.ore) html += line('矿石', '+' + p.ore);
  if(p.smelt) html += line('冶铁', '消耗矿石 ' + (p.smelt * 3) + ' → 精铁 +' + p.smelt);
  html += '</div>';

  html += '<div class="card">';
  html += '<h4>旗帜</h4>';
  html += '<div class="flag" style="width:100%;height:60px;background:linear-gradient(135deg,' +
    S.lord.colorA + ' 0%,' + S.lord.colorA + ' 55%,' + S.lord.colorB + ' 55%,' +
    S.lord.colorB + ' 100%)"></div>';
  html += '</div>';

  openSheet('领主', html, function(){
    bindSlots($('sbody'));
  });
}

/* ================= 建筑产出表 ================= */
var BUILD_OUT = {
  house:    { main: '住人',     sub: '—' },
  well:     { main: '水',       sub: '—' },
  farm:     { main: '粮食',     sub: '—' },
  lumber:   { main: '木材',     sub: '—' },
  quarry:   { main: '石料',     sub: '—' },
  barracks: { main: '招兵折扣', sub: '—' },
  wall:     { main: '防守',     sub: '—' }
};

/* ================= 领地 ================= */
function renderLand(){
  var html = '';
  html += '<div class="card">';
  html += '<h4>建筑</h4>';
  var empty = true;
  for(var k in BUILD){
    if(!bCount(k)) continue;
    empty = false;
    html += '<div class="line"><span>' + BUILD[k].name +
      '<span class="sub" style="display:block">' + BUILD_OUT[k].main +
      '</span></span><span class="v">' + bCount(k) + ' 座</span></div>';
    html += '<div class="sub" style="margin:-4px 0 6px">' + bSummary(k) + '</div>';
  }
  if(empty) html += '<div class="sub">还没有任何建筑。</div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<h4>特殊建筑</h4>';
  var has = false;
  for(var s in SPECIAL){
    if(!S.special[s]) continue;
    has = true;
    var staff = S.staff[s];
    var rateTxt = staff ? ('在位：' + staff.name) : '空缺（停摆）';
    html += '<div class="line"><span>' + SPECIAL[s].name +
      '<span class="sub" style="display:block">' + rateTxt + '</span></span>' +
      '<span class="v">' + SPECIAL[s].out + '</span></div>';
  }
  if(!has) html += '<div class="sub">一张图纸都没用上。</div>';
  if(has) html += '<div class="btns"><button class="btn ghost" id="staffbtn">人员安排</button></div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<h4>防守</h4>';
  html += line('城墙防御', wallDef() || '没有城墙');
  html += line('兵力防御', Math.round(armyPower().def * 0.35));
  html += line('夜袭概率', Math.round((0.12 + (rule().raid || 0)) * 100) + '%');
  html += '<div class="sub">第 8 天起才会有人摸过来。</div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<h4>手艺人</h4>';
  if(!S.talents.length){
    html += '<div class="sub">招兵的时候偶尔会遇到愿意留下的人。</div>';
  }else{
    S.talents.forEach(function(t){
      var busy = isStaffed(t.id);
      html += line(t.name + '　' + t.job,
        '<span class="sub">' + (busy ? '在位' : '闲着') + '</span>');
    });
  }
  html += '</div>';

  openSheet('领地', html, function(){
    var sb = $('staffbtn');
    if(sb) sb.onclick = function(){ openStaff(); };
  });
}

function openStaff(){
  var html = '<div class="sub" style="margin-bottom:10px">把合适的人派进建筑，才会开工。空着的建筑完全停摆。</div>';
  for(var s in SPECIAL){
    if(!S.special[s]) continue;
    var cur = S.staff[s];
    html += '<div class="line"><span>' + SPECIAL[s].name +
      '<span class="sub" style="display:block">' + (cur ? cur.name : '空缺') +
      '</span></span><button class="btn sm' + (cur ? ' gray' : '') +
      '" data-staff="' + s + '">' + (cur ? '换人' : '安排') + '</button></div>';
  }
  openSheet('人员安排', html, function(){
    $('sbody').querySelectorAll('[data-staff]').forEach(function(b){
      b.onclick = function(){ pickStaff(b.dataset.staff, false); };
    });
  });
}
function pickStaff(key, fromBuild){
  var need = SPECIAL[key] ? SPECIAL[key].job : '';
  var free = S.talents.filter(function(t){
    return !isStaffed(t.id);
  });
  if(!free.length){ toast('没有空闲的人手'); return; }
  var html = '<div class="sub" style="margin-bottom:10px">' +
    (need ? '这里要的是' + need + '。' : '') + '谁进去都行，对口的人干得更好。</div>';
  free.forEach(function(t){
    var good = (t.job === need);
    html += '<div class="line"><span>' + t.name +
      '<span class="sub" style="display:block">' + t.job + '　' + t.skill +
      (good ? '　对口' : '') + '</span></span>' +
      '<button class="btn sm' + (good ? '' : ' gray') + '" data-pick="' + t.id + '">派去</button></div>';
  });
  openSheet(SPECIAL[key] ? SPECIAL[key].name : '安排', html, function(){
    $('sbody').querySelectorAll('[data-pick]').forEach(function(b){
      b.onclick = function(){
        for(var i = 0; i < S.talents.length; i++){
          if(S.talents[i].id === b.dataset.pick){
            S.staff[key] = {
              id: S.talents[i].id,
              name: S.talents[i].name,
              job: S.talents[i].job
            };
          }
        }
        save();
        closeSheet();
        if(fromBuild) renderBuild();
        else renderLand();
      };
    });
  });
}
function isStaffed(id){
  for(var k in S.staff){
    if(S.staff[k] && S.staff[k].id === id) return true;
  }
  return false;
}

/* ================= 建造 ================= */
function renderBuild(){
  var html = '';
  var m = costMod();
  if(m > 1){
    html += '<div class="card soft"><div class="sub">此地运输不便，建造与升级的耗材多出一成。</div></div>';
  }
  for(var k in BUILD){
    var b = BUILD[k];
    var cnt = bCount(k);
    var low = bLowest(k);
    var allMax = cnt > 0 && bAllMax(k);
    var bc = buildCost(k);
    html += '<div class="card">';
    html += '<h4>' + b.name + '　<span class="sub">' + cnt + ' 座</span></h4>';
    html += '<div class="sub">' + (cnt ? bSummary(k) : '还没建') + '</div>';
    html += '<div class="sub">' + b.desc + '</div>';
    html += '<div class="sub" style="margin-top:4px">主产：' + BUILD_OUT[k].main + '</div>';
    html += '<div class="sub">建造一座：木 ' + bc.wood +
      (bc.stone ? '　石 ' + bc.stone : '') + '　精力 1</div>';
    if(cnt && !allMax){
      var c1 = oneUpCost(k, low);
      var ca = allUpCost(k);
      html += '<div class="sub">升一座：木 ' + c1.wood + ' 石 ' + c1.stone + '　精力 1</div>';
      html += '<div class="sub">全升一级：木 ' + ca.wood + ' 石 ' + ca.stone + '　精力 2</div>';
    }
    html += '<div class="btns">';
    html += '<button class="btn sm" data-build="' + k + '">建造</button>';
    if(cnt && !allMax){
      html += '<button class="btn sm ghost" data-up1="' + k + '">升一座</button>';
      html += '<button class="btn sm gray" data-upall="' + k + '">全升一级</button>';
    }
    if(cnt && allMax) html += '<span class="sub" style="align-self:center">全部满级</span>';
    html += '</div></div>';
  }

  html += '<div class="card soft"><h4>特殊建筑</h4><div class="sub">需要图纸，还要有人主持才转。</div></div>';
  for(var s in SPECIAL){
    var sp = SPECIAL[s];
    var own = !!S.special[s];
    var blue = countItem(sp.blue);
    var sw = Math.round(sp.wood * m), ss = Math.round(sp.stone * m);
    var who = S.staff[s];
    html += '<div class="card">';
    html += '<h4>' + sp.name + '　<span class="sub">' + (own ? '已建成' : '未建') + '</span></h4>';
    html += '<div class="sub">' + sp.out + '</div>';
    html += '<div class="sub" style="margin-top:4px">木 ' + sw + '　石 ' + ss +
      '　图纸：' + (blue ? '有 ' + blue + ' 张' : '缺') + '</div>';
    html += '<div class="btns">';
    if(!own){
      html += '<button class="btn sm" data-spec="' + s + '">开工　精力 1</button>';
    }else{
      html += '<span class="sub" style="align-self:center">' +
        (who ? '在位：' + esc(who.name) : '空缺（停摆）') + '</span>';
      html += '<button class="btn sm ghost" data-post="' + s + '">' + (who ? '换人' : '派人') + '</button>';
      if(s === 'forge') html += '<button class="btn sm ghost" data-forgeopen="1">强化装备　精力 1</button>';
    }
    html += '</div></div>';
  }

  openSheet('建造', html, function(){
    var body = $('sbody');
    body.querySelectorAll('[data-build]').forEach(function(b){
      b.onclick = function(){ doBuild(b.dataset.build); };
    });
    body.querySelectorAll('[data-up1]').forEach(function(b){
      b.onclick = function(){ doUpgradeOne(b.dataset.up1); };
    });
    body.querySelectorAll('[data-upall]').forEach(function(b){
      b.onclick = function(){ doUpgradeAll(b.dataset.upall); };
    });
    body.querySelectorAll('[data-spec]').forEach(function(b){
      b.onclick = function(){ doSpecialBuild(b.dataset.spec); };
    });
    body.querySelectorAll('[data-post]').forEach(function(b){
      b.onclick = function(){ pickStaff(b.dataset.post, true); };
    });
    var fo = body.querySelector('[data-forgeopen]');
    if(fo) fo.onclick = function(){ openForge(); };
  });
}

function doBuild(key){
  var bc = buildCost(key);
  if(S.res.wood < bc.wood || S.res.stone < bc.stone){ toast('材料不够'); AUDIO.play('fail'); return; }
  if(S.energy.cur < 1){ toast('精力不够，明天再说'); AUDIO.play('fail'); return; }
  S.res.wood -= bc.wood;
  S.res.stone -= bc.stone;
  S.energy.cur -= 1;
  S.builds[key].push(1);
  AUDIO.play('build');
  saySys('又立起一座' + BUILD[key].name + '。');
  save();
  renderBar();
  renderBuild();
}
function doUpgradeOne(key){
  var arr = S.builds[key];
  if(!arr.length) return;
  var idx = bLowIndex(key);
  if(idx < 0) return;
  var lv = arr[idx];
  if(lv >= 5){ toast('已经满级'); return; }
  var c = oneUpCost(key, lv);
  if(S.res.wood < c.wood || S.res.stone < c.stone){ toast('材料不够'); AUDIO.play('fail'); return; }
  if(S.energy.cur < 1){ toast('精力不够，明天再说'); AUDIO.play('fail'); return; }
  S.res.wood -= c.wood;
  S.res.stone -= c.stone;
  S.energy.cur -= 1;
  arr[idx] = lv + 1;
  AUDIO.play('build');
  saySys('一座' + BUILD[key].name + '修整完，升到 ' + (lv + 1) + ' 级。');
  save();
  renderBar();
  renderBuild();
}
function doUpgradeAll(key){
  var arr = S.builds[key];
  if(!arr.length) return;
  if(bAllMax(key)){ toast('全都满级了'); return; }
  var c = allUpCost(key);
  if(S.res.wood < c.wood || S.res.stone < c.stone){ toast('材料不够'); AUDIO.play('fail'); return; }
  if(S.energy.cur < 2){ toast('全部动工要两格精力'); AUDIO.play('fail'); return; }
  S.res.wood -= c.wood;
  S.res.stone -= c.stone;
  S.energy.cur -= 2;
  var n = 0;
  for(var i = 0; i < arr.length; i++){
    if(arr[i] < 5){ arr[i] += 1; n++; }
  }
  AUDIO.play('build');
  saySys(BUILD[key].name + '一并动工，' + n + ' 座同时修整完。');
  save();
  renderBar();
  renderBuild();
}
function doSpecialBuild(key){
  var sp = SPECIAL[key];
  if(S.special[key]){ toast('已经建过了'); return; }
  if(countItem(sp.blue) <= 0){ toast('缺' + ITEMS[sp.blue].name); AUDIO.play('fail'); return; }
  var m = costMod();
  var w = Math.round(sp.wood * m), s = Math.round(sp.stone * m);
  if(S.res.wood < w || S.res.stone < s){ toast('材料不够'); AUDIO.play('fail'); return; }
  if(S.energy.cur < 1){ toast('精力不够，明天再说'); AUDIO.play('fail'); return; }
  takeItem(sp.blue, 1);
  S.res.wood -= w;
  S.res.stone -= s;
  S.energy.cur -= 1;
  S.special[key] = 1;
  S.staff[key] = null;
  AUDIO.play('build');
  saySys(sp.name + '落成了，可屋里空着——还缺一个' + sp.job + '。');
  save();
  renderBar();
  renderBuild();
  setTimeout(function(){
    if(S.talents.length) toast('去「领地」里安排人手，这里才转得起来');
  }, 700);
}

/* ================= 铁匠铺 ================= */
function forgeCost(plus){
  var c = { gold: 100 * (plus + 1), iron: 2 * (plus + 1), coal: plus + 1 };
  if(plus >= 2) c.gem = 1;
  return c;
}
function openForge(){
  if(!hasStaff('forge')){
    toast('铁匠铺空着，得先有个铁匠主持');
    return;
  }
  var html = '<div class="sub">用精铁和煤把已经上身的家伙再锻一遍。每级属性 +50%，最多 +3。锻第三级要一块魔晶。</div>';
  var list = [];
  ['weapon', 'armor', 'charm'].forEach(function(s){
    if(S.equip[s]) list.push({ who: 'lord', name: S.lord.name, slot: s, e: S.equip[s] });
  });
  S.heroes.forEach(function(h){
    ['weapon', 'armor', 'charm'].forEach(function(s){
      if(h.equip[s]) list.push({ who: h.id, name: h.name, slot: s, e: h.equip[s] });
    });
  });
  if(!list.length){
    html += '<div class="card soft"><div class="sub">手边没有已经上身的装备。先装上再拿来锻。</div></div>';
  }
  list.forEach(function(x){
    var it = ITEMS[x.e.id];
    var plus = x.e.plus || 0;
    var c = forgeCost(plus);
    html += '<div class="line"><span>' + esc(it.name) + (plus ? ' +' + plus : '') +
      '<span class="sub" style="display:block">' + esc(x.name) + '　' + SLOT_NAME[x.slot] + '</span></span>';
    if(plus >= 3){
      html += '<span class="sub">已到顶</span>';
    }else{
      html += '<button class="btn sm" data-forge="' + x.who + '|' + x.slot + '">+1　' +
        c.gold + '金 ' + c.iron + '铁 ' + c.coal + '煤' +
        (c.gem ? ' ' + c.gem + '晶' : '') + '</button>';
    }
    html += '</div>';
  });
  openSheet('铁匠铺', html, function(){
    $('sbody').querySelectorAll('[data-forge]').forEach(function(b){
      b.onclick = function(){
        var p = b.dataset.forge.split('|');
        doForge(p[0], p[1]);
      };
    });
  });
}
function doForge(who, slot){
  if(!hasStaff('forge')){ toast('铁匠铺空着'); return; }
  var tgt = null;
  if(who === 'lord') tgt = S.equip;
  else{
    for(var i = 0; i < S.heroes.length; i++){
      if(S.heroes[i].id === who) tgt = S.heroes[i].equip;
    }
  }
  if(!tgt || !tgt[slot]) return;
  var plus = tgt[slot].plus || 0;
  if(plus >= 3){ toast('已经锻到头了'); return; }
  var c = forgeCost(plus);
  if(S.res.gold < c.gold){ toast('金币不够'); AUDIO.play('fail'); return; }
  if(countItem('iron') < c.iron){ toast('精铁不够'); AUDIO.play('fail'); return; }
  if(countItem('coal') < c.coal){ toast('煤炭不够'); AUDIO.play('fail'); return; }
  if(c.gem && countItem('gem') < c.gem){ toast('还差一块魔晶'); AUDIO.play('fail'); return; }
  if(S.energy.cur < 1){ toast('精力不够，明天再说'); AUDIO.play('fail'); return; }
  S.res.gold -= c.gold;
  takeItem('iron', c.iron);
  takeItem('coal', c.coal);
  if(c.gem) takeItem('gem', c.gem);
  S.energy.cur -= 1;
  tgt[slot].plus = plus + 1;
  AUDIO.play('build');
  saySys(ITEMS[tgt[slot].id].name + (c.gem ? '压进一块魔晶，' : '过了第二遍火，') +
    '锻到 +' + (plus + 1) + '。');
  save();
  renderBar();
  openForge();
}

/* ================= 英雄 ================= */
function renderHero(){
  var html = '';
  if(!S.heroes.length){
    html += '<div class="card soft"><div class="sub">还没有能带兵的人。招兵的时候，极偶尔会撞上一个。</div></div>';
  }
  S.heroes.forEach(function(h){
    var st = heroStat(h);
    var need = h.lv * 100;
    html += '<div class="card">';
    html += '<h4>' + esc(h.name) + '　<span class="sub">' + h.rarity + '　Lv' + h.lv +
      (h.injured ? '　<span style="color:#c4483f">有伤</span>' : '') + '</span></h4>';
    html += '<div class="sub">' + h.gender + '　' + h.age + ' 岁</div>';
    html += '<div class="sub">攻 ' + st.atk + '　防 ' + st.def + '　体 ' + st.hp + '</div>';
    html += '<div class="sub">经验 ' + h.exp + ' / ' + need + '</div>';
    html += bar(h.exp / need * 100);
    html += '<div class="btns"><button class="btn sm ghost" data-hero="' + h.id + '">查看</button></div>';
    html += '</div>';
  });
  openSheet('英雄', html, function(){
    $('sbody').querySelectorAll('[data-hero]').forEach(function(b){
      b.onclick = function(){ showHero(b.dataset.hero); };
    });
  });
}
function showHero(id){
  var h = null;
  for(var i = 0; i < S.heroes.length; i++){
    if(S.heroes[i].id === id) h = S.heroes[i];
  }
  if(!h) return;
  var st = heroStat(h);
  var need = h.lv * 100;
  var html = '';
  html += '<div class="card soft"><h4>' + esc(h.name) + '　' + h.rarity + '</h4>' +

/* ================= 仓库 ================= */
function renderStore(){
  var cats = ['图纸', '兵营', '材料', '消耗品', '装备'];
  var html = '';
  var any = false;
  cats.forEach(function(c){
    var ids = [];
    for(var id in S.items){
      if(ITEMS[id].cat === c && S.items[id] > 0) ids.push(id);
    }
    if(!ids.length) return;
    any = true;
    html += '<div class="card"><h4>' + (c === '兵营' ? '兵营图' : c) + '</h4>';
    ids.forEach(function(id){
      var it = ITEMS[id];
      html += '<div class="line"><span>' + esc(it.name) + ' ×' + S.items[id] +
        '<span class="sub" style="display:block">' + esc(it.desc) + '</span></span>';
      if(c === '消耗品') html += '<button class="btn sm" data-use="' + id + '">使用</button>';
      else if(c === '装备') html += '<button class="btn sm" data-eq="' + id + '">装备</button>';
      else if(c === '图纸') html += '<button class="btn sm ghost" data-bp="1">建造</button>';
      else if(c === '兵营') html += '<button class="btn sm ghost" data-camp="1">兵营</button>';
      else html += '<span class="sub">×' + S.items[id] + '</span>';
      html += '</div>';
    });
    html += '</div>';
  });
  if(!any) html += '<div class="card soft"><div class="sub">仓库空着，连老鼠都不来。</div></div>';
  openSheet('仓库', html, function(){
    var body = $('sbody');
    body.querySelectorAll('[data-use]').forEach(function(b){
      b.onclick = function(){ useItem(b.dataset.use); };
    });
    body.querySelectorAll('[data-eq]').forEach(function(b){
      b.onclick = function(){ equipPick(b.dataset.eq); };
    });
    body.querySelectorAll('[data-bp]').forEach(function(b){
      b.onclick = function(){ closeSheet(); renderBuild(); };
    });
    body.querySelectorAll('[data-camp]').forEach(function(b){
      b.onclick = function(){ closeSheet(); renderCamp(); };
    });
  });
}
function equipPick(id){

    esc(it.desc) + '</div></div>';

/* ================= 兵营 ================= */
function renderCamp(){

  for(var k in TROOP){
    if(S.unlocked[k] && S.troops[k].n > 0){
      parts.push(TROOP[k].name + ' ' + S.troops[k].n);
    }
  }
  html += '<div class="sub">' + (parts.length ? parts.join('　') : '一个兵都没有') + '</div>';
  html += '<div class="sub">招一次五个人，花一格精力。兵营等级越高，单价越便宜。</div>';
  html += '</div>';

  for(var k2 in TROOP){
    var t = TROOP[k2];
    var u = S.troops[k2];
    var un = S.unlocked[k2];
    html += '<div class="card">';

    if(!un){
      var bp = TROOP_BP[k2];
      var have = bp ? countItem(bp) : 0;
      html += '<h4>' + t.name + '　<span class="sub">未开营</span></h4>';
      html += '<div class="sub">' + t.desc + '</div>';

      html += '<div class="btns">';

      else html += '<span class="sub" style="align-self:center">开箱有机会出</span>';
      html += '</div></div>';
      continue;
    }

    var st = troopStat(k2);
    var need = troopExpNeed(u.lv);
    var next = u.lv === 1 ? t.up2 : (u.lv === 2 ? t.up3 : null);

    html += '<h4>' + t.name + '　<span class="sub">' + u.n + ' 人　' +
      LV_NAME[u.lv - 1] + '</span></h4>';
    html += '<div class="sub">' + t.desc + '</div>';
    html += '<div class="sub">攻 ' + st.atk + '　防 ' + st.def + '　体 ' + st.hp + '</div>';

    if(u.lv < 3){
      html += '<div class="sub">晋升经验 ' + u.exp + ' / ' + need + '</div>';
      html += bar(u.exp / need * 100);
      var ct = '金 ' + next.gold;
      if(next.iron) ct += '　精铁 ' + next.iron;
      if(next.coal) ct += '　煤炭 ' + next.coal;
      if(next.hide) ct += '　兽皮 ' + next.hide;
      if(next.horse) ct += '　战马 ' + next.horse;
      html += '<div class="sub">晋升到' + LV_NAME[u.lv] + '：' + ct + '　精力 1</div>';
    }else{
      html += '<div class="sub">已经高级，升不上去了。</div>';
    }

    html += '<div class="btns">';
    html += '<button class="btn sm" data-rec="' + k2 + '">招募五人　单价 ' +
      recruitCost(k2) + ' 金</button>';
    if(u.lv < 3) html += '<button class="btn sm ghost" data-promo="' + k2 + '">晋升</button>';
    html += '</div></div>';
  }

  openSheet('兵营', html, function(){
    var body = $('sbody');
    body.querySelectorAll('[data-unlock]').forEach(function(b){
      b.onclick = function(){ doUnlockTroop(b.dataset.unlock); };
    });
    body.querySelectorAll('[data-rec]').forEach(function(b){
      b.onclick = function(){ doRecruit(b.dataset.rec); };
    });
    body.querySelectorAll('[data-promo]').forEach(function(b){
      b.onclick = function(){ doPromote(b.dataset.promo); };
    });
  });
}

function doUnlockTroop(k){
  var bp = TROOP_BP[k];
  if(!bp || S.unlocked[k]) return;
  if(countItem(bp) <= 0){ toast('没有图纸'); return; }
  takeItem(bp, 1);
  S.unlocked[k] = true;
  AUDIO.play('bell');
  saySys(TROOP[k].name + '的营盘搭起来了。往后可以招' + TROOP[k].name + '了。');
  save();
  renderCamp();
}
function doRecruit(k){
  if(!S.unlocked[k]){ toast('这个兵种还没开营'); return; }
  var unit = recruitCost(k);
  var can = Math.floor(S.res.gold / unit);
  if(can <= 0){ toast('金币不够一个兵'); AUDIO.play('fail'); return; }
  if(S.energy.cur < 1){ toast('精力不够，明天再说'); AUDIO.play('fail'); return; }
  var n = Math.min(5, can);
  S.res.gold -= unit * n;
  S.energy.cur -= 1;
  S.troops[k].n += n;
  AUDIO.play('crowd');
  saySys('营里添了 ' + n + ' 个' + TROOP[k].name + '。');
  var tp = S.lord.nature === 'kind' ? 0.08 : 0.05;
  if(chance(tp)) addTalent();
  if(chance(0.01)) addHero();
  save();
  renderBar();
  renderCamp();
}
function doPromote(k){
  var t = TROOP[k];
  var u = S.troops[k];
  if(u.lv >= 3){ toast('已经高级了'); return; }
  var need = troopExpNeed(u.lv);
  if(u.exp < need){ toast('经验还不够，再打几场'); AUDIO.play('fail'); return; }
  var c = u.lv === 1 ? t.up2 : t.up3;
  if(S.res.gold < c.gold){ toast('金币不够'); AUDIO.play('fail'); return; }
  if(c.iron && countItem('iron') < c.iron){ toast('精铁不够'); AUDIO.play('fail'); return; }
  if(c.coal && countItem('coal') < c.coal){ toast('煤炭不够'); AUDIO.play('fail'); return; }
  if(c.hide && countItem('hide') < c.hide){ toast('兽皮不够'); AUDIO.play('fail'); return; }
  if(c.horse && countItem('horse') < c.horse){ toast('战马不够'); AUDIO.play('fail'); return; }
  if(S.energy.cur < 1){ toast('精力不够，明天再说'); AUDIO.play('fail'); return; }
  S.res.gold -= c.gold;
  if(c.iron) takeItem('iron', c.iron);
  if(c.coal) takeItem('coal', c.coal);
  if(c.hide) takeItem('hide', c.hide);
  if(c.horse) takeItem('horse', c.horse);
  S.energy.cur -= 1;
  u.exp -= need;
  u.lv += 1;
  AUDIO.play('level');
  say(t.name + '整队重训，升到了' + LV_NAME[u.lv - 1] + '。', 'good');
  save();
  renderBar();
  renderCamp();
}

/* ================= 地图 ================= */
var RES_NAME = { gold: '金币', wood: '木材', stone: '石料', food: '粮食', water: '水' };
var RES_IDS = ['gold', 'wood', 'stone', 'food', 'water'];
var pickHero = null;
var BOXES = [
  { name: '青铜箱', w: 70,  lo: 40,  hi: 120,  item: 0.25, bp: 0 },
  { name: '白银箱', w: 22,  lo: 90,  hi: 240,  item: 0.45, bp: 0 },
  { name: '黄金箱', w: 6,   lo: 180, hi: 420,  item: 0.65, bp: 0.02 },
  { name: '铂金箱', w: 1.6, lo: 350, hi: 800,  item: 0.85, bp: 0.08 },
  { name: '钻石箱', w: 0.4, lo: 700, hi: 1500, item: 1,    bp: 0.2 }
];
var ITEM_POOL = ['iron', 'coal', 'ore', 'hide', 'gem', 'potion', 'grain', 'scroll', 'tea', 'sword', 'bow', 'armor', 'charm'];

function isRes(id){ return RES_IDS.indexOf(id) >= 0; }
function itemName(id){
  if(isRes(id)) return RES_NAME[id];
  if(id === 'pop') return '人口';
  return ITEMS[id] ? ITEMS[id].name : id;
}
function pickWeight(w){
  var t = 0, i;
  for(i = 0; i < w.length; i++) t += w[i];
  var r = Math.random() * t;
  for(i = 0; i < w.length; i++){
    r -= w[i];
    if(r <= 0) return i;
  }
  return w.length - 1;
}
function fillSpot(m, type, lv){
  var mt = MAPTYPE[type];
  m.type = type;
  m.lv = lv;
  m.atk = Math.round(mt.atk * (0.7 + lv * 0.35));
  m.def = Math.round(mt.def * (0.7 + lv * 0.35));
  m.hp = Math.round(mt.hp * (0.7 + lv * 0.4));
  m.left = 3;
  m.scouted = false;
}
function genSpot(i, type){
  var m = { i: i };
  fillSpot(m, type, ri(1, 3));
  return m;
}
function genMap(){
  var types = Object.keys(MAPTYPE);
  var pool = types.slice();
  var arr = [];
  for(var i = 0; i < 8; i++){
    var t = pool.length ? pool.splice(ri(0, pool.length - 1), 1)[0] : pick(types);
    arr.push(genSpot(i, t));
  }
  return arr;
}
function ensureMap(){
  if(!Array.isArray(S.map) || S.map.length !== 8) S.map = genMap();
  S.map.forEach(function(m, i){
    m.i = i;
    if(!MAPTYPE[m.type]) fillSpot(m, pick(Object.keys(MAPTYPE)), ri(1, 3));
    if(typeof m.left !== 'number') m.left = 3;
    if(typeof m.scouted !== 'boolean') m.scouted = false;
  });
}
function spotOf(i){
  var out = null;
  S.map.forEach(function(m){ if(m.i === i) out = m; });
  return out;
}
function resetSpot(m){
  fillSpot(m, pick(Object.keys(MAPTYPE)), ri(1, 3));
}
function doScout(i){
  var m = spotOf(i);
  if(!m) return;
  if(m.scouted){ toast('早看过了'); return; }
  if(S.scout <= 0){ toast('今天看过的地方够多了'); AUDIO.play('fail'); return; }
  var free = hasStaff('watch');
  if(!free && S.energy.cur < 1){ toast('精力不够，明天再说'); AUDIO.play('fail'); return; }
  S.scout -= 1;
  if(!free) S.energy.cur -= 1;
  m.scouted = true;
  AUDIO.play('crowd');
  saySys(free ? '塔上的人打了个旗语，位置和人数都报了下来。' : '派出去的人贴着草根摸了个来回。');
  say('是' + MAPTYPE[m.type].name + '。外围' + m.lv + ' 层哨，' +
    (m.lv >= 3 ? '人站得很密' : '人不多') + '，都带着家伙。');
  save();
  renderBar();
  renderAct();
}

/* ================= 战利品 ================= */
function baseAmount(id, lv){
  var k = 1 + (lv - 1) * 0.7;
  if(id === 'gold') return Math.round(rf(50, 110) * k);
  if(id === 'wood') return Math.round(rf(80, 160) * k);
  if(id === 'stone') return Math.round(rf(70, 140) * k);
  if(id === 'food') return Math.round(rf(60, 120) * k);
  if(id === 'water') return Math.round(rf(90, 180) * k);
  if(id === 'pop') return ri(1, 2);
  if(id === 'gem') return Math.max(1, Math.round(rf(1, 2) * k));
  if(id === 'charm') return 1;
  if(id === 'horse') return 1;
  if(id === 'hide') return Math.max(1, Math.round(rf(1, 3) * k));
  if(id === 'ore') return Math.max(1, Math.round(rf(3, 6) * k));
  if(id === 'iron') return Math.max(1, Math.round(rf(2, 4) * k));
  if(id === 'coal') return Math.max(1, Math.round(rf(3, 5) * k));
  return 1;
}
function lootOf(m){
  var mt = MAPTYPE[m.type];
  var out = { res: {}, items: [], lines: [] };

  var mainAmt = baseAmount(mt.main, m.lv);
  out.lines.push('主产：' + itemName(mt.main) + ' +' + mainAmt);
  if(isRes(mt.main)) out.res[mt.main] = (out.res[mt.main] || 0) + mainAmt;
  else if(mt.main === 'pop') S.pop += mainAmt;
  else out.items.push({ id: mt.main, n: mainAmt });

  var subs = mt.sub.slice().sort(function(){ return Math.random() - 0.5; });
  if(rule().lootHide && subs.indexOf('hide') < 0) subs.unshift('hide');
  var cnt = chance(0.6) ? 2 : 1;
  for(var i = 0; i < cnt && i < subs.length; i++){
    var id = subs[i];
    var amt = Math.max(1, Math.round(baseAmount(id, m.lv) * 0.4));
    if(isRes(id)) out.res[id] = (out.res[id] || 0) + amt;
    else if(id === 'pop') S.pop += amt;
    else out.items.push({ id: id, n: amt });
    out.lines.push('副产：' + itemName(id) + ' +' + amt);
  }
  for(var r in out.res) S.res[r] += out.res[r];
  out.items.forEach(function(it){ addItem(it.id, it.n); });
  return out;
}
function rollBox(){
  var luck = lordEq().luck;
  var w = [70, 22, 6, 1.6, 0.4];
  if(S.lord.nature === 'sly') w = [55, 28, 11, 4.5, 1.5];
  if(luck > 0){
    w[0] = Math.max(18, w[0] - luck * 3);
    w[2] += luck * 1.6;
    w[3] += luck * 0.7;
  }
  var idx = pickWeight(w);
  var box = BOXES[idx];
  var out = { box: box.name, res: {}, items: [] };

  var keys = ['gold', 'wood', 'stone', 'food'].sort(function(){ return Math.random() - 0.5; });
  var cnt = ri(2, 3);
  for(var i = 0; i < cnt; i++){
    var k = keys[i];
    out.res[k] = Math.round(rf(box.lo, box.hi) * (k === 'gold' ? 1 : 2.4));
    S.res[k] += out.res[k];
  }
  if(chance(box.item)){
    var id = pick(ITEM_POOL);
    if(ITEMS[id].slot && idx < 2) id = 'iron';
    var n = idx >= 3 ? ri(2, 3) : 1;
    out.items.push({ id: id, n: n });
    addItem(id, n);
  }
  if(chance(box.bp)){
    var pool = ['bp_forge', 'bp_mine', 'bp_smelter', 'bp_colliery', 'bp_market', 'bp_stable', 'bp_watch', 'bp_shrine'];
    for(var t in TROOP_BP){
      if(!S.unlocked[t]) pool.push(TROOP_BP[t]);
    }
    var bp = pick(pool);
    out.items.push({ id: bp, n: 1 });
    addItem(bp, 1);
  }
  return out;
}
function addExp(h, n){
  h.exp += n;
  while(h.exp >= h.lv * 100 && h.lv < 99){
    h.exp -= h.lv * 100;
    h.lv += 1;
    say(h.name + ' 打出了手感，升到 ' + h.lv + ' 级。', 'good');
    AUDIO.play('level');
  }
}
function loseTroops(rate){
  var lost = 0;
  for(var k in S.troops){
    var n = S.troops[k].n;
    if(!n) continue;
    var l = Math.floor(n * rate + Math.random());
    if(l > n) l = n;
    S.troops[k].n = n - l;
    lost += l;
  }
  return lost;
}

/* ================= 出征 ================= */
function doMarch(i){
  var m = spotOf(i);
  if(!m) return;
  if(!m.scouted){ toast('没探过的地方不敢走'); AUDIO.play('fail'); return; }
  if(S.energy.cur < 1){ toast('精力不够，明天再说'); AUDIO.play('fail'); return; }
  if(troopTotal() <= 0){ toast('手上没兵，去了也是送'); AUDIO.play('fail'); return; }

  var hero = null;
  if(pickHero){
    for(var hi = 0; hi < S.heroes.length; hi++){
      if(S.heroes[hi].id === pickHero) hero = S.heroes[hi];
    }
    if(hero && hero.injured) hero = null;
  }

  var ap = armyPower();
  var eq = lordEq();
  var hA = 0, hD = 0, hH = 0;
  if(hero){
    var hs = heroStat(hero);
    hA = hs.atk;
    hD = hs.def;
    hH = hs.hp;
  }
  var mm = moraleAtk();
  var myA = (ap.atk + hA + eq.atk) * mm;
  var myD = ap.def + hD + eq.def;
  var myH = ap.hp + hH;
  var eA = Math.round(m.atk * 3.5);
  var eD = Math.round(m.def * 3.5);
  var eH = Math.round(m.hp * 2.8 * (rule().enemyHp || 1));
  var myP = myA * 1.5 + myD * 1.2 + myH * 0.5;
  var eP = eA * 1.5 + eD * 1.2 + eH * 0.5;
  var winRate = myP / (myP + eP);

  S.energy.cur -= 1;
  AUDIO.play('clash');
  saySys(hero ? (hero.name + '带队出去了，路面被踩得发响。') : '队伍开出去，路面被踩得发响。');

  var base = eP / (myP + eP);
  var lossRate = clamp(base * 0.45, 0.03, 0.7);
  if(S.lord.nature === 'bold') lossRate *= 0.73;
  if(hero) lossRate *= 0.9;
  lossRate *= (rule().loss || 1);

  if(chance(winRate)){
    var lost = loseTroops(lossRate);
    var loot = lootOf(m);
    var box = rollBox();

    for(var tk in S.troops){
      if(S.troops[tk].n > 0 && S.troops[tk].lv < 3){
        S.troops[tk].exp += 20 + m.lv * 15;
      }
    }
    if(hero) addExp(hero, 15 + m.lv * 12);

    m.left -= 1;
    say(MAPTYPE[m.type].name + '拿下来了。折了 ' + lost + ' 个人，剩下的开始翻箱倒柜。', 'good');
    say(MAPTYPE[m.type].snip, 'sys');
    loot.lines.forEach(function(t){ say(t, 'good'); });
    say(box.box + '里还有：' + Object.keys(box.res).map(function(k){
      return RES_NAME[k] + ' +' + box.res[k];
    }).join('　'));
    box.items.forEach(function(it){
      say('带回来 ' + itemName(it.id) + ' ×' + it.n + '。', 'good');
    });

    if(m.left <= 0){
      resetSpot(m);
      say('这地方被掏干了。过了些日子，风向一变，又搬进来别的东西。', 'sys');
    }
  }else{
    var lost2 = loseTroops(clamp(lossRate * 1.6, 0.15, 0.85));
    S.morale = clamp(S.morale - 5, 0, 100);
    say(MAPTYPE[m.type].name + '的人早有准备。队伍退回来了，折了 ' + lost2 + ' 个。', 'warn');
    AUDIO.play('fail');
    if(hero){
      hero.exp += 8 + m.lv * 5;
      if(chance(0.5)){
        hero.injured = 1;
        say(hero.name + '身上开了口子，得用疗伤药。', 'warn');
      }
    }else if(S.heroes.length && chance(0.4)){
      pick(S.heroes).injured = 1;
    }
  }
  save();
  renderBar();
  renderAct();
}

/* ================= 夜袭 ================= */
function raidCheck(){
  if(S.day < 8) return;
  var p = 0.12 + (rule().raid || 0);
  if(!chance(p)) return;
  var power = 5 + S.day * 0.6 + ri(0, 3);
  var def = wallDef() + armyPower().def * 0.35;
  if(def >= power){
    S.morale = clamp(S.morale + 2, 0, 100);
    say('夜里有人摸过来，被城墙和巡哨挡回去了。', 'sys');
    return;
  }
  var gap = (power - def) / power;
  var lw = Math.round(40 * gap);
  var ls = Math.round(30 * gap);
  var lf = Math.round(50 * gap);
  S.res.wood = Math.max(0, S.res.wood - lw);
  S.res.stone = Math.max(0, S.res.stone - ls);
  S.res.food = Math.max(0, S.res.food - lf);
  var lp = Math.max(0, Math.round(S.pop * 0.05 * gap));
  S.pop = Math.max(1, S.pop - lp);
  S.morale = clamp(S.morale - 6, 0, 100);
  AUDIO.play('clash');
  say('夜里来了一伙人。仓里被翻走木 ' + lw + '、石 ' + ls + '、粮 ' + lf +
    (lp ? '，走了 ' + lp + ' 口人' : '') + '。', 'warn');
}

/* ================= 日结 ================= */
function doEndDay(){
  if(busy) return;
  busy = true;
  NO_LOG = true;
  var p = prod();
  var need = foodNeed();
  var wNeed = waterNeed();
  S.res.food += p.food - need;
  S.res.water += p.water - wNeed;
  S.res.wood += p.wood;
  S.res.stone += p.stone;
  S.res.gold += p.gold;
  if(p.iron) addItem('iron', p.iron);
  if(p.coal) addItem('coal', p.coal);
  if(p.ore) addItem('ore', p.ore);

  if(p.smelt){
    var canSmelt = Math.min(p.smelt, Math.floor(countItem('ore') / 3));
    if(canSmelt > 0){
      takeItem('ore', canSmelt * 3);
      addItem('iron', canSmelt);
    }
  }

  if(p.hide) addItem('hide', p.hide);
  if(p.horse && chance(0.35 * (rule().horse || 1))) addItem('horse', 1);
  try{
    sayDay();

    if(S.res.food < 0){
      S.res.food = 0;
      var lost = Math.max(1, Math.round(S.pop * 0.12));
      S.pop = Math.max(0, S.pop - lost);
      S.morale = clamp(S.morale - 8, 0, 100);
      say('仓底刮出声。' + lost + ' 户人家天没亮就收拾东西走了。', 'warn');
      AUDIO.play('fail');
    }else{
      say('粮进仓 ' + p.food + ' 份，吃掉 ' + need + ' 份。');
      var growP = 0.4 * (rule().popGrow || 1);
      if(S.res.food > need * 2 && S.pop < houseCap() && chance(growP)){
        var grow = Math.max(1, Math.round(S.pop * 0.02));
        S.pop = Math.min(houseCap(), S.pop + grow);
        say('日子还过得去，添了 ' + grow + ' 口人。', 'good');
      }
      S.morale = clamp(S.morale + (hasStaff('shrine') ? 2 : 1), 0, 100);
    }

    if(S.res.water < 0){
      S.res.water = 0;
      var extra = Math.round(need * 0.3);
      S.res.food = Math.max(0, S.res.food - extra);
      var lp0 = Math.max(1, Math.round(S.pop * 0.05));
      S.pop = Math.max(1, S.pop - lp0);
      S.morale = clamp(S.morale - 5, 0, 100);
      say('水缸见了底。' + lp0 + ' 口人收拾东西走了，粮食也多耗了 ' + extra + ' 份。', 'warn');
      AUDIO.play('fail');
    }else if(p.water > 0){
      say('水井打上来 ' + p.water + ' 桶水，用掉 ' + wNeed + ' 桶。');
    }else if(wNeed > 0){
      say('没有水井，' + wNeed + ' 桶水全靠外面挑。');
    }

    if(p.wood) say('木材 +' + p.wood + '。');
    if(p.stone) say('石料 +' + p.stone + '。');
    if(p.iron) say('精铁 +' + p.iron + '。');
    if(p.coal) say('煤炭 +' + p.coal + '。');
    if(p.ore) say('矿石 +' + p.ore + '。');
    if(p.smelt > 0) say('冶铁坊开了一炉，' + (p.smelt * 3) + ' 份矿石炼成 ' + p.smelt + ' 块精铁。', 'good');
    if(p.gold) say('市集收上来 ' + p.gold + ' 枚金币。');

    if(rule().foodLoss && S.res.food > 0){
      var fl = Math.round(S.res.food * rule().foodLoss);
      if(fl > 0){
        S.res.food -= fl;
        say('夜里冷得厉害，烧掉 ' + fl + ' 份存粮取暖。', 'warn');
      }
    }
    if(rule().plague && chance(rule().plague) && S.pop > 5){
      var lp = ri(1, 3);
      S.pop = Math.max(1, S.pop - lp);
      S.morale = clamp(S.morale - 2, 0, 100);
      say('潮气重，有人发起热来，走了 ' + lp + ' 口人。', 'warn');
    }

    if(chance(0.5)){
      var ev = pick(EVENTS);
      say(ev.t, 'sys');
      safe(ev.f);
    }

    raidCheck();

    S.energy.max = 3 + (hasStaff('shrine') ? 1 : 0);
    S.energy.cur = S.energy.max;
    S.day += 1;
    S.scout = scoutMax();

    var chDay = rule().channelDay || 30;
    if(S.day >= chDay && !S.flags.chOpen){
      S.flags.chOpen = true;
      saySys('第 ' + S.day + ' 天，世界频道和交易行开了。外面的人开始听见你的名字。');
    }

    say('第 ' + S.day + ' 天，天亮了。');
    save();
    renderBar();
  }catch(e){
  }
  busy = false;
  setTimeout(function(){ maybeEvent(); }, 700);
}

/* ================= 世界频道 ================= */
function ensureWorld(){
  var chDay = rule().channelDay || 30;
  if(S.day < chDay) return;
  if(!S.channel.length) seedChannel();
  if(!S.market.length) seedMarket();
}
function seedChannel(){
  var lines = [
    '北边那条路的雪化了，有人走过。',
    '谁家有多余的粮，我拿铁换。',
    '昨晚上听见山里有动静，别睡太死。',
    '我这边的林子被砍秃一半了。',
    '有没有人愿意搭伙清一清路上的匪。',
    '西边那口井的水发苦，别喝。',
    '我把城墙补完了，总算能睡个整觉。',
    '新来的都别急着扩，先看粮。'
  ];
  S.channel = [];
  for(var i = 0; i < 6; i++){
    S.channel.push({ who: pick(NPC_LORDS), text: pick(lines), me: false, day: S.day });
  }
}
function openWorld(mode){
  $('world').classList.add('on');
  switchWorld(mode);
}
function switchWorld(mode){
  curWorld = mode;
  ensureWorld();
  if(mode === 'ch'){
    $('wtitle').textContent = '世 界 频 道';
    $('wch').style.display = '';
    $('wmk').style.display = 'none';
    renderChannel();
  }else{
    $('wtitle').textContent = '交 易 行';
    $('wch').style.display = 'none';
    $('wmk').style.display = '';
    renderMarket();
  }
  $('world').scrollTop = 0;
}
function renderChannel(){
  var box = $('wch');
  var chDay = rule().channelDay || 30;
  if(S.day < chDay){
    box.innerHTML = '<div class="card soft"><div class="sub">频道还没开。' +
      (chDay > 30 ? '此地偏僻，要等到第 ' + chDay + ' 天。' : '第 30 天，外面的人才听得见你。') +
      '</div></div>';
    return;
  }
  var html = '';
  var list = S.channel.slice(-40);
  for(var i = 0; i < list.length; i++){
    var m = list[i];
    html += '<div class="chatmsg' + (m.me ? ' me' : '') + '"><span class="who">' +
      esc(m.who) + '</span>　' + esc(m.text) + '</div>';
  }
  html += '<div id="chatin"><input id="chtext" placeholder="说点什么" />' +
    '<button id="chsend">发</button></div>';
  box.innerHTML = html;
  $('chsend').onclick = sendChannel;
  $('chtext').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); sendChannel(); }
  });
}
function sendChannel(){
  var inp = $('chtext');
  if(!inp) return;
  var v = inp.value.trim();
  if(!v) return;
  S.channel.push({ who: S.lord.name, text: v, me: true, day: S.day });
  if(S.channel.length > 60) S.channel = S.channel.slice(-60);
  renderChannel();
  save();
  var replies = [
    '有人应了一声，说改天来你这边看看。',
    '那边沉默了一会儿，回了个「嗯」。',
    '有人笑，说你这话说得太实。',
    '几个人跟着附和，很快聊到别处去了。',
    '一个没见过的名字问你在哪片地界。'
  ];
  setTimeout(function(){
    S.channel.push({ who: pick(NPC_LORDS), text: pick(replies), me: false, day: S.day });
    if(S.channel.length > 60) S.channel = S.channel.slice(-60);
    if($('world').classList.contains('on') && curWorld === 'ch') renderChannel();
    save();
  }, 1100);
}

/* ================= 交易行 ================= */
function seedMarket(){
  S.market = [];
  for(var i = 0; i < 6; i++) S.market.push(makeLot());
}
function makeLot(){
  if(chance(0.45)){
    var ids = ['iron', 'coal', 'ore', 'horse', 'hide', 'gem', 'potion', 'grain', 'scroll', 'tea', 'sword', 'bow', 'armor', 'charm'];
    var id = pick(ids);
    var base = {
      iron: 40, coal: 30, ore: 20, horse: 120, hide: 30, gem: 200, potion: 60,
      grain: 50, scroll: 90, tea: 70, sword: 150, bow: 220, armor: 180, charm: 160
    }[id] || 60;
    return {
      id: 'lot' + Date.now() + ri(1, 999),
      kind: 'item', key: id, n: 1,
      price: Math.round(base * rf(0.9, 1.3)),
      seller: pick(NPC_LORDS)
    };
  }
  var res = pick(['wood', 'stone', 'food', 'water']);
  var n = res === 'water' ? ri(80, 200) : ri(60, 180);
  var unit = { wood: 1.1, stone: 1.2, food: 0.9, water: 0.7 }[res];
  return {
    id: 'lot' + Date.now() + ri(1, 999),
    kind: 'res', key: res, n: n,
    price: Math.round(n * unit * rf(0.85, 1.25)),
    seller: pick(NPC_LORDS)
  };
}
function priceMul(){
  var d = S.lord.origin === 'merchant' ? 0.9 : 1;
  return d * (rule().price || 1);
}
function renderMarket(){
  var box = $('wmk');
  var chDay = rule().channelDay || 30;
  if(S.day < chDay){
    box.innerHTML = '<div class="card soft"><div class="sub">交易行还没开。' +
      (chDay > 30 ? '此地偏僻，要等到第 ' + chDay + ' 天。' : '第 30 天之后才有人在这儿摆摊。') +
      '</div></div>';
    return;
  }
  var disc = priceMul();
  var html = '';
  if(disc > 1){
    html += '<div class="card soft"><div class="sub">路远船少，这儿的价钱比别处高。</div></div>';
  }
  for(var i = 0; i < S.market.length; i++){
    var lot = S.market[i];
    var name = lot.kind === 'item' ? ITEMS[lot.key].name : RES_NAME[lot.key];
    var price = Math.round(lot.price * disc);
    html += '<div class="card"><div class="line"><span>' + esc(name) + ' ×' + lot.n +
      '<span class="sub" style="display:block">' + esc(lot.seller) + ' 挂的</span></span>' +
      '<span class="v">' + price + ' 金</span></div>' +
      '<div class="btns"><button class="btn sm" data-buy="' + i + '">买下</button></div></div>';
  }
  if(!S.market.length) html += '<div class="card soft"><div class="sub">货架空着。</div></div>';
  box.innerHTML = html;
  box.querySelectorAll('[data-buy]').forEach(function(b){
    b.onclick = function(){ buyLot(parseInt(b.dataset.buy, 10)); };
  });
}
function buyLot(i){
  var lot = S.market[i];
  if(!lot) return;
  var price = Math.round(lot.price * priceMul());
  if(S.res.gold < price){ toast('金币不够'); AUDIO.play('fail'); return; }
  S.res.gold -= price;
  if(lot.kind === 'item') addItem(lot.key, lot.n);
  else S.res[lot.key] += lot.n;
  S.market.splice(i, 1);
  S.market.push(makeLot());
  AUDIO.play('coin');
  save();
  renderBar();
  renderMarket();
}
